name: Probe data sources (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          exec > out.txt 2>&1
          UA="Mozilla/5.0 (HartlandEsportsTicker)"
          echo "=== hartlandeagles"; curl -sSL -A "$UA" https://hartlandeagles.com/ -o he.html -w "%{http_code} %{size_download}\n"
          grep -o 'href="[^"]*Event/[^"]*"' he.html | head -3
          python3 - <<'PY'
          import re
          s=open('he.html',encoding='utf-8',errors='ignore').read()
          i=s.find('/Event/')
          print(s[max(0,i-2500):i+2500])
          print('---- scripts'); print('\n'.join(sorted(set(re.findall(r'<script[^>]+src="([^"]+)"',s))))[:3000])
          print('---- api-ish'); print(sorted(set(re.findall(r'["\'](/api/[^"\']+|https?://[^"\']*api[^"\']*)["\']',s)))[:40])
          PY
          echo "=== espn"; curl -sS -D - -o espn.json -H "Origin: https://hartlandesports.com" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" | grep -i "^HTTP\|access-control"; head -c 300 espn.json; echo
          curl -sS -o cf.json "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=5"; python3 -c "import json;d=json.load(open('cf.json'));print('CFB B1G',len(d.get('events',[])),[e['shortName'] for e in d.get('events',[])][:5])"
          curl -sS -o cf2.json "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=15"; python3 -c "import json;d=json.load(open('cf2.json'));print('CFB MAC',len(d.get('events',[])),[e['shortName'] for e in d.get('events',[])][:5])"
          for f in https://www.esportsinsider.com/feed https://dotesports.com/feed https://www.dexerto.com/feed/ https://esports-news.co.uk/feed/ https://www.rocketleague.com/en/news/rss https://liquipedia.net/rocketleague/api.php; do echo "=== $f"; curl -sSL -A "$UA" -o f.xml -w "%{http_code} %{content_type} %{size_download}\n" "$f"; grep -o "<title>[^<]*</title>" f.xml | head -4; done
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          s=open('out.txt',encoding='utf-8',errors='ignore').read()
          n=6000
          for k in range(0,min(len(s),n*10),n):
              part=s[k:k+n].replace('%','%25').replace('\r','').replace('\n','%0A')
              print('::notice title=part%d::%s'%(k//n,part))
          PY
