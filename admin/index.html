<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site Manager · Hartland Esports</title>
<link rel="icon" href="../assets/eagle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#EDF1F6;--panel:#fff;--field:#F5F8FB;--ink:#0B1F33;--muted:#5A6B7F;--line:#D6DFE8;--navy:#00274C;--gold:#FFBC05;--chip:#E4EAF1;--danger:#B3261E;--ok:#1E7A45;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.topbar{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:6px;padding:9px 15px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;line-height:1;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px #fff}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--gold)}
.status{border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1);color:#C9D6E3}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#8FA3B8;margin-right:7px}
.status.ok::before{background:#5BD68A}.status.warn::before{background:var(--gold)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;max-width:1200px;margin:0 auto;padding:20px}
@media (max-width:820px){.layout{grid-template-columns:1fr;padding:14px}}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.side{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}}
.side button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:6px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:820px){.side button{background:var(--panel);border:1px solid var(--line)}}
.side button:hover{background:var(--chip);color:var(--ink)}
.side button[aria-current="true"]{background:var(--navy);color:#fff}
.side .dot{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted)}
.side button[aria-current="true"] .dot{background:rgba(255,255,255,.15);color:#fff}
.side .dot.off{background:#F6E1DF;color:#8A2A22}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase}
h3{margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.intro{margin:0;color:var(--muted);max-width:70ch}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FFF8E1;border:1px solid #F0D98A;border-radius:8px;padding:10px 14px}
.switch.off{background:#F5F7FA;border-color:var(--line)}
.item{border:1px solid var(--line);border-radius:10px;background:var(--field);padding:12px;display:flex;flex-direction:column;gap:10px}
.item input,.item select,.item textarea{background:#fff}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-h b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px;flex-shrink:0}
.tools button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;display:grid;place-items:center;color:var(--ink)}
.tools button:hover:not(:disabled){border-color:var(--gold)}
.tools button:disabled{opacity:.35;cursor:default}
.tools .x:hover{color:var(--danger);border-color:var(--danger)}
.add{align-self:flex-start;border:1.5px dashed var(--line);background:transparent;border-radius:6px;padding:8px 14px;font-weight:600}
.add:hover{border-color:var(--gold);background:var(--chip)}
.grid>.add{justify-self:start}
.sub{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sub-row{display:grid;gap:6px;align-items:end;grid-template-columns:repeat(var(--n),minmax(0,1fr)) auto}
.sub-row .tools button{width:26px;height:26px}
.sub-row label.f>span{font-size:10.5px}
.sub-h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:0}
.img-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-f img{width:84px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
.img-f .ph{width:84px;height:60px;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;background:#fff}
.img-f input[type=url]{flex:1;min-width:160px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--gold);color:var(--navy)}
.muted{color:var(--muted);font-size:13.5px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps code,.muted code{background:var(--chip);padding:1px 5px;border-radius:3px;font-size:13px}
.notice{border-radius:8px;padding:10px 14px;font-size:14px}
.notice.warn{background:#FFF4D1;color:#4A3B00;border:1px solid #F0D98A}
.notice.ok{background:#E3F4EA;color:#123F25;border:1px solid #B7DFC5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--gold);padding:10px 16px;border-radius:6px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);z-index:50}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><small>Hartland Eagles Esports</small><h1>Site Manager</h1></div>
  <div class="actions">
    <span class="status" id="status">Not connected</span>
    <a class="btn btn-ghost" href="scores/">Scorekeeper</a>
    <a class="btn btn-ghost" href="../portal/">Newsletter portal</a>
    <a class="btn btn-ghost" href="../" target="_blank" rel="noopener">View site</a>
    <button class="btn btn-gold" id="publish" type="button" disabled>Publish changes</button>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main class="panel" id="panel"><p class="muted">Loading…</p></main>
</div>
<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="standInput" accept=".csv,.json,text/csv,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SITE_BASE = new URL("../", location.href).href;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, Math.max(3800, m.length * 60)); }

/* ---------- GitHub ---------- */
const GH_KEY = "eagles-gh";
function repoGuess(){
  const m = /^([^.]+)\.github\.io$/i.exec(location.hostname);
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m && seg ? {owner:m[1], repo:seg} : {owner:"KamiNoTe14", repo:"esports-newsletter"};
}
function ghCfg(){ try { return JSON.parse(localStorage.getItem(GH_KEY)) || null; } catch(e){ return null; } }
function ghSave(c){ try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch(e){} }
async function gh(path, opts = {}){
  const c = ghCfg(); if (!c?.token) throw new Error("Not connected");
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`, {...opts, headers:{"Accept":"application/vnd.github+json","Authorization":`Bearer ${c.token}`,"X-GitHub-Api-Version":"2022-11-28", ...(opts.body ? {"Content-Type":"application/json"} : {})}});
  if (!r.ok){ const e = new Error(`GitHub said ${r.status}`); e.status = r.status; try { e.detail = (await r.json()).message; } catch(x){} throw e; }
  return r.status === 204 ? null : r.json();
}
const b64enc = str => { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));

/* ---------- state ---------- */
let site = null, siteSha = null, dirty = false, connected = false, ghUser = "";
const pending = {}; // path -> base64 image data
let tab = "connect";
function setDirty(v){ dirty = v; $("#publish").disabled = !(v && connected); renderSide(); }
window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });
function getP(path){ return path.split(".").reduce((o, k) => o?.[k], site); }
function setP(path, v){ const ks = path.split("."); const last = ks.pop(); const o = ks.reduce((o, k) => o[k], site); o[last] = v; }

/* ---------- schema ---------- */
const TABS = [
  {id:"connect", label:"Connect"},
  {id:"program", label:"Program & join"},
  {id:"contact", label:"Coaches & links"},
  {id:"teams", label:"Teams & rosters", toggle:"rosters", toggleLabel:"Show rosters on the Teams page"},
  {id:"games", label:"Games"},
  {id:"profiles", label:"Player profiles"},
  {id:"schools", label:"School library"},
  {id:"rivals", label:"Rivals"},
  {id:"standings", label:"Standings", toggle:"standings", toggleLabel:"Show league standings"},
  {id:"brackets", label:"Playoff brackets", toggle:"brackets", toggleLabel:"Show playoff brackets"},
  {id:"records", label:"Program records", toggle:"records", toggleLabel:"Show program records"},
  {id:"legacyRecords", label:"Pre-tracking records"},
  {id:"news", label:"News articles", toggle:"news", toggleLabel:"Show news articles"},
  {id:"gallery", label:"Photo gallery", toggle:"gallery", toggleLabel:"Show the photo gallery"},
  {id:"sponsors", label:"Sponsors", toggle:"sponsors", toggleLabel:"Show sponsors"},
  {id:"roadmap", label:"Future updates"}
];
const LISTS = {
  teams:{title:"Team", add:"Add team", intro:"Each team card on the Teams and Home pages. Separate multiple leagues with commas.", name:i => `${i.game || "Game"} · ${i.name || "Team"}`,
    fields:[["game","Game (as shown on the site)"],["name","Team name"],["gameKey","Game type (for scores)","select",() => [["", "—"], ...(site.games || []).map(g => [g.key, g.name || g.key])]],["level","Level","select",["Varsity","JV"]],["leagues","Leagues"],["note","Note (optional)"],["art","Card artwork for this team (optional; overrides the game's)","image"]],
    sub:{key:"roster", title:"Roster", add:"Add player", fields:[["name","Name"],["tag","Gamertag"],["role","Role (optional)"],["captain","Captain","check"],["private","Gamertag only","check"]]}},
  standings:{title:"Standings table", add:"Add standings table", intro:"Paste in league standings from RallyCry. Download the standings from RallyCry as CSV or JSON and click \"Import RallyCry file\", or type the rows in by hand. Check \"Hartland\" on our row to highlight it.", name:i => i.title || "Standings",
    fields:[["title","Title","text","MHSEL Smash Varsity · Division 2"],["updated","Updated","date"],["link","Link to full standings","url"],["on","Show this table","check"]],
    sub:{key:"rows", title:"Rows", add:"Add row", importBtn:"Import RallyCry file (CSV or JSON)", fields:[["rank","#"],["team","Team"],["school","School"],["w","W"],["l","L"],["rating","Rating"],["us","Hartland","check"]]}},
  games:{title:"Game", add:"Add game", intro:"Every game we compete in. The scorekeeper uses this to know how a match is scored, so adding a new title is just filling this in. Stats are entered for each game or map and added up; the website shows match totals, each player's role, and only a player's three most-used characters (never how often). Then pick it as the \"Game type\" on that team.", name:i => i.name || "Game",
    fields:[["name","Full name","text","Rocket League"],["short","Short name","text","Rocket League"],["abbr","Abbreviation","text","RL"],["key","ID (no spaces, don't change once used)","text","rocket-league"],["unit","A match is a series of…","select",["Game","Set","Map","Round"]],["points","Score inside each one (blank = just win/lose)","text","Goals"],["bestOf","Usually best of","select",["1","3","5","7"]],["teamSize","Players per side","text","3"],["stats","Player stats to track (comma separated; end one with % to average it)","text","Goals, Assists, Saves, Accuracy %"],["roles","Roles a player can pick (optional)","text","Vanguard, Duelist, Strategist"],["charLabel","Track a character per game? Name the box (blank = no)","text","Hero"],["chars","Character list, for suggestions while typing","textarea"],["icon","Icon (optional)","image"],["art","Card artwork, shown in the corner of team cards (optional)","image"],["liveFeed","Live game data for the stream score bug","select",[["","Off (scorekeeper only)"],["sos","Rocket League: clock and goals from the game (official Stats API)"]]]]},
  rivals:{title:"Rival", add:"Add rival", intro:"Matches against these schools get a gold rivalry tag on the scores strip, the Results page and the scorekeeper. Type the school the way it appears in matches; \"Howell\" also matches \"Howell High School\".", name:i => i.school || "Rival",
    fields:[["school","School","text","Howell"],["title","Rivalry name (optional)","text","Battle of M-59"],["note","Why they're a rival (for the rivalry pages later)","textarea"]]},
  brackets:{title:"Bracket", add:"Add bracket", intro:"Link to the bracket on RallyCry, upload a screenshot of it, or both.", name:i => i.title || "Bracket",
    fields:[["title","Title","text","Fall 2026 MHSEL Playoffs · Smash"],["league","League"],["status","Status","select",["","Upcoming","In progress","Final"]],["link","Bracket link","url"],["image","Bracket image","image"],["text","Notes","textarea"],["on","Show this bracket","check"]]},
  records:{title:"Record", add:"Add record", intro:"The record book on the Legacy page. Championships and top finishes hang as banners, everything with a season goes on the timeline, honors are listed by title, and statistical records get their own table.", name:i => i.title || "Record",
    fields:[["title","Title","text","State Champions"],["type","Type (decides where it shows)","select",[["milestone","Milestone (timeline only)"],["championship","State or league championship (gold banner)"],["tournament","Tournament or invitational win (white banner)"],["finish","Runner-up or top finish (silver banner)"],["honor","Honor, one per player (listed under its title)"],["record","Statistical record (records table)"]]],["org","League or event","text","MHSEL"],["year","Season, with the year","text","Fall 2024"],["game","Game","select",() => [["", "All games / program-wide"], ...(site.games || []).map(g => [g.key, g.name || g.key])]],["value","The number (statistical records only)","text","27–2"],["detail","Details (the story; for an honor, the player's name)","textarea"]]},
  news:{title:"Article", add:"Add article", intro:"News coverage of the program. Newest shows first.", name:i => i.title || "Article",
    fields:[["title","Headline"],["source","Source","text","Livingston Daily"],["date","Date","date"],["link","Link","url"],["image","Image (optional)","image"],["summary","Summary","textarea"]]},
  gallery:{title:"Photo", add:"Add photo", intro:"Photos appear in the Media page gallery. Use albums to group them (for example \"Fall 2026 States\").", name:i => i.caption || "Photo",
    fields:[["image","Photo","image"],["caption","Caption"],["album","Album (optional)"]]},
  sponsors:{title:"Sponsor", add:"Add sponsor", intro:"Logos show on the Home and About pages. Transparent PNG logos look best.", name:i => i.name || "Sponsor",
    fields:[["name","Name"],["link","Website","url"],["logo","Logo","image"]]},
  schools:{title:"School", add:"Add school", intro:"Colleges for player profiles: schools a player is interested in show with their logo, and a player who commits gets their profile re-skinned in that school's colors. Transparent PNG logos look best.", name:i => i.name || "School",
    fields:[["name","School","text","Michigan State University"],["short","Short name (optional)","text","Michigan State"],["primary","Primary color","color"],["secondary","Secondary color","color"],["logo","Logo","image"],["link","Esports program page (optional)","url"]]},
  legacyRecords:{title:"Pre-tracking record", add:"Add a legend", intro:"Records from before the scorekeeper existed. They show in their own \"Before the scorekeeper\" section of the record book, clearly marked, and never mix with the leaderboards that are worked out from logged matches. Check \"At least\" when the number is a provable floor: the site shows it with a + (for example 6 stocks for every best-of-3 set won, because you can't win one with fewer).", name:i => [i.holder, i.title].filter(Boolean).join(" · ") || "Record",
    fields:[["title","Record","text","Career stocks taken"],["holder","Who holds it","text","Griffin Appleby"],["game","Game","select",() => [["", "All games"], ...(site.games || []).map(g => [g.key, g.name || g.key])]],["value","Number","text","96"],["years","Years","text","2023–2025"],["note","How it was counted","textarea"],["floor","At least (show it with a +)","check"]]},
  roadmap:{title:"Planned feature", add:"Add a planned feature", intro:"Features planned for LevelUP that aren't built yet, with a short description of each. This list is just for the coaches; it doesn't show on the website.", name:i => i.title || "Feature",
    fields:[["title","Feature"],["status","Status","select",["Planned","Moved from a build (needs something we don't have yet)","In progress","Done"]],["text","What it is","textarea"]]},
  coaches:{title:"Coach", add:"Add coach", name:i => i.name || "Coach", fields:[["name","Name"],["role","Role"],["email","Email (optional)","email"]]},
  seasons:{title:"Season phase", add:"Add phase", name:i => i.name || "Phase", fields:[["name","Name"],["when","When"],["text","Description","textarea"]]}
};

/* ---------- rendering ---------- */
function renderSide(){
  $("#side").innerHTML = TABS.map(t => {
    let badge = "";
    if (t.toggle && site) badge = site.sections?.[t.toggle] === false ? `<span class="dot off">Off</span>` : (LISTS[t.id] && (site[t.id] || []).length ? `<span class="dot">${site[t.id].length}</span>` : "");
    if (t.id === "connect") badge = connected ? `<span class="dot">✓</span>` : `<span class="dot off">!</span>`;
    return `<button type="button" data-tab="${t.id}"${tab === t.id ? ' aria-current="true"' : ""}>${t.label}${badge}</button>`;
  }).join("");
}
function field(path, [key, label, type = "text", extra], val){
  const id = "f-" + path.replace(/\./g, "-");
  if (type === "check") return `<label class="toggle"><input id="${id}" type="checkbox" data-path="${path}"${val !== false && val !== undefined && val !== "" ? " checked" : ""}> ${esc(label)}</label>`;
  if (type === "color"){ const v = /^#[0-9a-f]{6}$/i.test(val || "") ? val : "#00274C"; return `<label class="f"><span>${esc(label)}</span><span style="display:flex;gap:8px;align-items:center"><input id="${id}" type="color" data-path="${path}" value="${esc(v)}" style="width:52px;height:38px;padding:2px"><code class="muted">${esc(val || "not set")}</code></span></label>`; }
  if (type === "textarea") return `<label class="f"><span>${esc(label)}</span><textarea id="${id}" data-path="${path}" rows="3">${esc(val)}</textarea></label>`;
  if (type === "select"){ const opts = (typeof extra === "function" ? extra() : extra).map(o => Array.isArray(o) ? o : [o, o]); return `<label class="f"><span>${esc(label)}</span><select id="${id}" data-path="${path}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val ?? "") ? " selected" : ""}>${esc(l || "—")}</option>`).join("")}</select></label>`; }
  if (type === "image"){
    const src = val ? (pending[val] ? `data:image/jpeg;base64,${pending[val]}` : (/^https?:/i.test(val) ? val : SITE_BASE + val)) : "";
    return `<div class="f"><label class="f"><span>${esc(label)}</span></label><div class="img-f">${src ? `<img src="${esc(src)}" alt="">` : `<div class="ph">No image</div>`}<button type="button" class="btn btn-line" data-upload="${path}">${val ? "Replace" : "Upload"}</button><input id="${id}" type="url" data-path="${path}" value="${esc(/^https?:/i.test(val || "") ? val : "")}" placeholder="…or paste an image link">${val ? `<button type="button" class="btn btn-line" data-clearimg="${path}">Remove</button>` : ""}</div></div>`;
  }
  return `<label class="f"><span>${esc(label)}</span><input id="${id}" type="${type === "date" ? "date" : type === "url" ? "url" : type === "email" ? "email" : "text"}" data-path="${path}" value="${esc(val)}"${extra ? ` placeholder="${esc(extra)}"` : ""}></label>`;
}
function listEditor(key, spec){
  const arr = site[key] = site[key] || [];
  const isCheck = f => f[2] === "check";
  return `<div class="grid" style="gap:10px">${arr.map((it, i) => {
    const base = `${key}.${i}`;
    const main = spec.fields.filter(f => !isCheck(f)), checks = spec.fields.filter(isCheck);
    return `<div class="item">

async function loadSite(){

async function connect(cfg){
  ghSave(cfg);
  try {
    const repo = await gh("");
    if (!repo.permissions?.push){ connected = false; toast("That key can read the repository but can't publish to it. Check its Contents permission."); return false; }
    cfg.branch = repo.default_branch || "main"; ghSave(cfg);
    connected = true;
    try { ghUser = (await (await fetch("https://api.github.com/user", {headers:{Authorization:`Bearer ${cfg.token}`}})).json()).login || ""; } catch(e){}
    return true;
  } catch(e){
    connected = false;
    toast(e.status === 401 ? "GitHub didn't accept that key. Copy it again and paste it in." : e.status === 404 ? "Couldn't find that repository with this key. Check the owner, repository and the key's repository access." : "Couldn't reach GitHub. Check your connection and try again.");
    return false;
  } finally { setStatus(); }
}
function setStatus(){
  const s = $("#status");
  s.className = "status " + (connected ? "ok" : "warn");
  s.textContent = connected ? (dirty ? "Unpublished changes" : "Connected to GitHub") : "Not connected: can't publish";

}
async function putFile(path, b64, message, sha){
  const c = ghCfg();
  return gh(`/contents/${path.split("/").map(encodeURIComponent).join("/")}`, {method:"PUT", body:JSON.stringify({message, content:b64, branch:c.branch || "main", ...(sha ? {sha} : {})})});
}
async function publish(){
  const btn = $("#publish"); btn.disabled = true; btn.textContent = "Publishing…";
  try {
    (site.standings || []).forEach(t => learnSchools(t.rows));
    fillIds();
    const used = JSON.stringify(site);
    for (const [path, data] of Object.entries(pending)){
      if (used.includes(`"${path}"`)) await putFile(path, data, `Site manager: add ${path.split("/").pop()}`);
      delete pending[path];
    }
    let sha = siteSha;
    try { const cur = await gh(`/contents/data/site.json?ref=${encodeURIComponent(ghCfg().branch || "main")}`); if (sha && cur.sha !== sha){ if (!confirmOverwrite()) { btn.textContent = "Publish changes"; setStatus(); return; } } sha = cur.sha; } catch(e){ if (e.status !== 404) throw e; }
    const res = await putFile("data/site.json", b64enc(JSON.stringify(site, null, 2) + "\n"), "Site manager: update site content", sha);
    siteSha = res.content.sha;
    setDirty(false); setStatus();
    toast("Published. The live site updates in about a minute.");
  } catch(e){
    toast(`Couldn't publish: ${e.detail || e.message}. Your edits are still here; try again.`);
    setStatus();
  } finally { btn.textContent = "Publish changes"; }
}

}

function readURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function shrink(file, maxW, png){
  const im = new Image(); im.src = await readURL(file); await im.decode();
  const sc = Math.min(1, maxW / im.naturalWidth), w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const cx = cv.getContext("2d");
  if (!png){ cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); }
  cx.drawImage(im, 0, 0, w, h);
  return cv.toDataURL(png ? "image/png" : "image/jpeg", .85).split(",")[1];
}

    const path = `assets/uploads/${coll}/${Date.now().toString(36)}-${slug}.${png ? "png" : "jpg"}`;

/* ---------- standings import (RallyCry CSV / JSON) ---------- */
let importPath = null;
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const delim = (text.split(/\r?\n/)[0].match(/\t/g) || []).length > (text.split(/\r?\n/)[0].match(/,/g) || []).length ? "\t" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const clean = rows.filter(r => r.some(v => v.trim()));
  if (clean.length < 2) return [];
  const head = clean[0].map(h => h.trim());
  return clean.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}
function flatten(o, pre = "", out = {}){
  for (const [k, v] of Object.entries(o || {})){
    const key = pre ? `${pre}.${k}` : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, key, out);
    else if (!Array.isArray(v)) out[key] = v;
  }
  return out;
}
function findRows(j){
  let best = null;
  (function walk(v){
    if (Array.isArray(v)){
      if (v.length && v.every(x => x && typeof x === "object" && !Array.isArray(x)) && (!best || v.length > best.length)) best = v;
      v.forEach(walk);
    } else if (v && typeof v === "object") Object.values(v).forEach(walk);
  })(j);
  return (best || []).map(x => flatten(x));
}
function mapStandings(recs){
  if (!recs.length) return {rows:[], keys:[]};
  const keys = [...new Set(recs.flatMap(r => Object.keys(r)))];
  const norm = k => k.toLowerCase().replace(/[^a-z0-9.]/g, "");
  const last = k => norm(k).split(".").pop();
  const pick = (tests, avoid) => {
    for (const t of tests){
      const hit = keys.find(k => (typeof t === "string" ? last(k) === t || norm(k) === t : t.test(norm(k))) && !(avoid && avoid.test(norm(k))));
      if (hit) return hit;
    }
    return null;
  };
  const kRank = pick(["place", "rank", "position", "standing", "pos", /(^|\.)(place|rank)/]);
  const kTeam = pick(["entry", "entries", "entryname", "team", "teamname", "name", "displayname", /entr(y|ies).*name/, /team.*name/, /(^|\.)name$/], /school|org|game|division|league|player|user/);
  const kSchool = pick(["school", "schoolname", "organization", "organizationname", "org", "orgname", "affiliation", /school/, /organi[sz]ation.*name/, /org.*name/]);
  const kWL = pick(["matchwl", "wl", "record", "matchrecord", /match.*wl|w.?l$/]);
  const kW = pick(["wins", "w", "matchwins", "win", /matchwin|wins$/], /loss|%|pct|percent|rate/);
  const kL = pick(["losses", "l", "matchlosses", "loss", /matchloss|losses$/], /win|%|pct|percent|rate/);
  const kRating = pick(["rating", "elo", "mmr", "rank rating", /rating|elo|mmr/]);
  const kBye = pick(["bye", "byes", "hasbye", /bye/]);
  const val = (r, k) => k == null || r[k] == null ? "" : String(r[k]).trim();
  const rows = recs.map((r, i) => {
    let w = val(r, kW), l = val(r, kL);
    if ((!w || !l) && kWL){ const m = val(r, kWL).match(/(\d+)\s*[-–/:]\s*(\d+)/); if (m){ w = w || m[1]; l = l || m[2]; } }
    let rating = val(r, kRating); if (/^-?\d+\.\d+$/.test(rating)) rating = String(Math.round(+rating));
    const bye = kBye && /^(true|yes|1|bye)$/i.test(val(r, kBye)) || /\bbye\b/i.test(val(r, kWL));
    const team = val(r, kTeam), school = val(r, kSchool) === team ? "" : val(r, kSchool);
    return {rank:val(r, kRank).replace(/(st|nd|rd|th)$/i, ""), team, school, w:w || (bye ? "Bye" : ""), l, rating, us:/hartland/i.test(team + " " + school)};
  }).filter(r => r.team);
  return {rows, keys, found:{place:kRank, team:kTeam, school:kSchool, wins:kW || kWL, losses:kL || kWL, rating:kRating}};
}
/* RallyCry "bracket" export: a list of matches. Rebuild the standings the way the League Platform does:
   every team starts at 1500; each match moves rating by Elo (K = 30, so +/-15 between equal teams);
   a bye is a match win but doesn't change rating. Teams with the same rating share a place. */
function tallyMatches(matches){
  const t = new Map();
  const get = n => { n = String(n || "").trim(); if (!n || /^(tbd|bye)$/i.test(n)) return null; if (!t.has(n)) t.set(n, {team:n, school:"", w:0, l:0, byes:0, rating:1500, diff:0}); return t.get(n); };
  matches.forEach(m => m.sides.forEach(sd => { const x = get(sd.name), sc = String(sd.school || "").trim(); if (x && sc) x.school = sc; }));
  const played = [];
  matches.forEach((m, i) => {
    if (m.state && !/^complete/i.test(m.state)) { m.sides.forEach(sd => get(sd.name)); return; }
    const sides = m.sides.filter(sd => get(sd.name));
    if (sides.length === 1){ const x = get(sides[0].name); x.w++; x.byes++; return; }
    if (sides.length !== 2) return;
    let win = sides.findIndex(sd => sd.won === true);
    if (win < 0){ const a = parseFloat(sides[0].score), b = parseFloat(sides[1].score);
      if (/^w$/i.test(sides[0].score) || /^(f|l)$/i.test(sides[1].score)) win = 0;
      else if (/^w$/i.test(sides[1].score) || /^(f|l)$/i.test(sides[0].score)) win = 1;
      else if (!isNaN(a) && !isNaN(b) && a !== b) win = a > b ? 0 : 1; }
    if (win < 0) return;
    played.push({when:m.when || "", i, W:get(sides[win].name), L:get(sides[1 - win].name), pts:[+sides[win].pts || 0, +sides[1 - win].pts || 0]});
  });
  played.sort((a, b) => (a.when > b.when) - (a.when < b.when) || a.i - b.i);
  for (const m of played){
    const exp = 1 / (1 + Math.pow(10, (m.L.rating - m.W.rating) / 400)), d = 30 * (1 - exp);
    m.W.rating += d; m.L.rating -= d; m.W.w++; m.L.l++;
    m.W.diff += m.pts[0] - m.pts[1]; m.L.diff += m.pts[1] - m.pts[0];
  }
  const list = [...t.values()];
  list.sort((a, b) => b.rating - a.rating || b.w - a.w || b.diff - a.diff || a.team.localeCompare(b.team));
  list.forEach((x, i) => { const p = list[i - 1]; x.rank = p && Math.abs(p.rating - x.rating) < 1e-6 ? p.rank : String(i + 1); });
  return list;
}
function matchesFrom(json, csv){
  if (json && Array.isArray(json.matches) && json.matches.some(m => Array.isArray(m.slots)))
    return json.matches.map(m => ({state:m.state, when:m.startDate || "", sides:(m.slots || []).map(sd => ({name:sd.entryName ?? sd.name, school:sd.schoolName ?? sd.entrySchoolName ?? sd.school?.name ?? (typeof sd.school === "string" ? sd.school : "") ?? "", won:sd.won, score:sd.gamesWon, pts:sd.roundsScored}))}));
  if (csv && csv.length && "Side 1" in csv[0])
    return csv.map(r => ({state:r.State, when:r["Start Time"] || "", sides:[{name:r["Side 1"], school:r["Side 1 School"], score:r["Side 1 Score"], pts:r["Side 1 Score"]}, {name:r["Side 2"], school:r["Side 2 School"], score:r["Side 2 Score"], pts:r["Side 2 Score"]}]}));
  return null;
}
function rankRows(rows){
  const num = v => { const n = parseFloat(v); return isNaN(n) ? -Infinity : n; };
  rows.sort((a, b) => num(b.w) - num(a.w) || num(a.l) - num(b.l) || num(b.rating) - num(a.rating) || a.team.localeCompare(b.team));
  rows.forEach((r, i) => { const p = rows[i - 1]; r.rank = p && p.w === r.w && p.l === r.l && String(p.rating || "") === String(r.rating || "") ? p.rank : String(i + 1); });
  return rows;
}
$("#standInput").addEventListener("change", async e => {
  const f = e.target.files?.[0]; e.target.value = ""; if (!f || !importPath) return;
  let recs = [], json = null, csv = null;
  try {
    const text = await f.text();
    if (/\.json$/i.test(f.name) || /^\s*[\[{]/.test(text)) { json = JSON.parse(text); recs = findRows(json); }
    else recs = csv = parseCSV(text);
  } catch(err){ toast("Couldn't read that file. Download a fresh CSV or JSON from RallyCry and try again."); return; }
  const old = getP(importPath) || [], byName = new Map(old.map(r => [String(r.team || "").trim().toLowerCase(), r]));
  const matches = matchesFrom(json, csv);
  let rows, keys = [], found = {};
  if (matches){
    rows = tallyMatches(matches).map(x => { const o = byName.get(x.team.toLowerCase()) || {};
      return {rank:x.rank, team:x.team, school:x.school || schoolFor(x.team) || o.school || "", w:String(x.w), l:String(x.l), rating:String(Math.round(x.rating)), us:o.us ?? /hartland/i.test(x.team + " " + (x.school || schoolFor(x.team) || o.school || ""))}; });
  } else {
    ({rows, keys, found} = mapStandings(recs));
    rows.forEach(r => { const o = byName.get(r.team.toLowerCase()) || {}; r.school = r.school || schoolFor(r.team) || o.school || ""; r.rating = r.rating || o.rating || ""; });
  }
  if (!rows.length){ toast(keys.length ? `Couldn't find the team names in that file. Columns seen: ${keys.slice(0, 12).join(", ")}` : "That file doesn't have any standings rows in it."); return; }
  const arr = getP(importPath);
  if (arr.length && !confirm(`Replace the ${arr.length} row${arr.length === 1 ? "" : "s"} in this table with ${rows.length} rows from ${f.name}?`)) return;
  arr.splice(0, arr.length, ...rows);
  const learned = learnSchools(rows), noSchool = rows.filter(r => !r.school).length;
  const table = getP(importPath.split(".").slice(0, -1).join("."));
  if (table) table.updated = new Date().toISOString().slice(0, 10);
  setDirty(true); setStatus(); renderPanel();
  const schoolNote = learned ? ` Saved ${learned} school${learned === 1 ? "" : "s"} to the team list.` : "";
  const schoolMiss = noSchool ? ` ${noSchool} team${noSchool === 1 ? " has" : "s have"} no school yet. Add them in the Team → school list below.` : "";
  const missing = matches ? [] : Object.entries(found).filter(([k, v]) => !v && k !== "school").map(([k]) => k);
  const us = rows.filter(r => r.us).length;
  toast(`Imported ${rows.length} teams${matches ? " and worked out W-L and ratings from the match results" : ""}${us ? `, ${us} Hartland row${us > 1 ? "s" : ""} highlighted` : ""}.${missing.length ? ` No ${missing.join("/")} column found, so check those.` : ""}${schoolNote}${schoolMiss} It goes live when you publish.`);
});

/* ---------- bio drafts: read every final match (same data as the website) and write a playbill-style summary ---------- */
let finalsP = null;
function loadFinals(){
  return finalsP = finalsP || (async () => {
    const live = await import(SITE_BASE + "assets/live.js?v=25");
    return new Promise(res => { let latest = null, t = null;
      live.watchFinals(site, (fin, dir) => { latest = {fin, dir}; clearTimeout(t); t = setTimeout(() => res(latest), 2500); });
      setTimeout(() => res(latest || {fin:[], dir:{alumni:[]}}), 15000); });
  })();
}
async function draftBio(id){
  const [{fin, dir}, R] = await Promise.all([loadFinals(), import(SITE_BASE + "assets/records.js?v=1")]);
  const names = {}, cur = new Set();
  fin.forEach(m => (m.players || []).forEach(p => { if (p.id) names[p.id] = p.private ? p.tag : (p.name || p.tag); }));
  (dir?.alumni || []).forEach(p => names[p.id] = p.private ? p.tag : (p.name || p.tag));
  (site.teams || []).forEach(t => (t.roster || []).forEach(p => { if (!p.id) return; cur.add(p.id); names[p.id] = p.private ? p.tag : (p.name || p.tag); }));
  return R.bioDraft(site, fin, id, {name:x => names[x] || "Player", current:x => cur.has(x)}, site.profiles?.[id] || {});
}

/* ---------- events ---------- */
$("#side").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; renderSide(); renderPanel(); $("#panel").scrollIntoView({block:"start"}); });
$("#panel").addEventListener("input", e => {
  if (e.target.id === "schoolList"){
    const m = {}; e.target.value.split(/\r?\n/).forEach(line => { const i = line.lastIndexOf("|"); if (i < 0) return; const n = line.slice(0, i).trim(), sc = line.slice(i + 1).trim(); if (n && sc) m[n] = sc; });
    site.teamSchools = m; setDirty(true); setStatus(); return;
  }
  const el = e.target, path = el.dataset.path; if (!path) return;
  setP(path, el.type === "checkbox" ? el.checked : el.value);
  setDirty(true); setStatus();
  if (el.type === "checkbox" && path.startsWith("sections.")) renderPanel();
  if (el.type === "url" && /\.(image|logo)$/.test(path)) { clearTimeout(renderPanel.t); renderPanel.t = setTimeout(() => { const pos = el.id; renderPanel(); document.getElementById(pos)?.focus(); }, 900); }
});
$("#panel").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "ghConnect"){
    const cfg = {owner:$("#ghOwner").value.trim(), repo:$("#ghRepo").value.trim(), token:$("#ghToken").value.trim()};
    if (!cfg.token){ toast("Paste your access key first."); return; }
    b.disabled = true; b.textContent = "Connecting…";
    if (await connect(cfg)){ if (!dirty) await loadSite(); toast("Connected. You can publish changes now."); tab = "program"; }
    renderSide(); renderPanel(); return;
  }
  if (b.id === "ghForget"){ const c = ghCfg() || {}; delete c.token; ghSave(c); connected = false; setStatus(); renderSide(); renderPanel(); toast("Key removed from this computer."); return; }
  if (b.dataset.add){
    const arr = getP(b.dataset.add); const key = b.dataset.add.split(".").pop();
    const blank = {teams:{id:"t" + Date.now().toString(36), game:"", name:"", gameKey:"", level:"Varsity", leagues:"MHSEL", note:"", roster:[]}, rivals:{school:"", title:"", note:""}, games:{key:"", name:"", short:"", abbr:"", unit:"Game", points:"", bestOf:"3", teamSize:"", stats:"", roles:"", charLabel:"", chars:"", icon:"", art:""}, standings:{title:"", updated:new Date().toISOString().slice(0, 10), link:"", on:true, rows:[]}, brackets:{title:"", league:"MHSEL", status:"Upcoming", link:"", image:"", text:"", on:true}, roster:{id:"", name:"", tag:"", role:"", captain:false, private:false}, rows:{rank:"", team:"", school:"", w:"", l:"", rating:"", us:false}, schools:{id:"s-" + Date.now().toString(36), name:"", short:"", primary:"", secondary:"", logo:"", link:""}, legacyRecords:{title:"", holder:"", game:"", value:"", years:"", note:"", floor:false}, roadmap:{title:"", status:"Planned", text:""}}[key] || {};
    arr.push(blank); setDirty(true); setStatus(); renderPanel(); return;
  }
  if (b.dataset.del){
    if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "?"; b.title = "Click again to remove"; setTimeout(() => { if (b.isConnected){ b.classList.remove("armed"); b.textContent = "×"; } }, 3000); return; }
    getP(b.dataset.del).splice(+b.dataset.i, 1); setDirty(true); setStatus(); renderPanel(); return;
  }
  if (b.dataset.move){
    const arr = getP(b.dataset.move), i = +b.dataset.i, j = i + (+b.dataset.d);
    if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; setDirty(true); setStatus(); renderPanel(); return;
  }
  if (b.dataset.biodraft){
    const id = b.dataset.biodraft, area = document.getElementById("bio-" + id), pr = site.profiles[id] || {};
    if (area.value.trim() && !confirm("Replace the bio that's there with a fresh draft from their record?")) return;
    b.disabled = true; b.textContent = "Reading their matches…";
    try { const text = await draftBio(id); area.value = text; setP(`profiles.${id}.bio`, text); setDirty(true); setStatus(); toast("Draft written. Edit it however you like; your version is what goes live."); }
    catch(err){ console.error(err); toast("Couldn't read the match results right now. Try again in a minute."); }
    finally { b.disabled = false; b.textContent = "Write a draft from their record"; }
    return;
  }
  if (b.dataset.import){ importPath = b.dataset.import; $("#standInput").click(); return; }
  if (b.dataset.upload){ uploadPath = b.dataset.upload; $("#imgInput").click(); return; }
  if (b.dataset.clearimg){ setP(b.dataset.clearimg, ""); setDirty(true); setStatus(); renderPanel(); return; }
});

  if (cfg?.token) await connect(cfg);
