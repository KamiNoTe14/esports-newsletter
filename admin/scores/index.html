<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00274C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scorekeeper · Hartland Esports</title>
<link rel="icon" href="../../assets/eagle.png">
<link rel="apple-touch-icon" href="../../assets/eagle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#00274C; --navy-2:#003466; --bg:#061423; --surface:#0D2238; --surface-2:#13304D; --line:#1E3D5E; --line-2:#2C5279;
  --text:#F2F6FA; --muted:#9DB0C6; --gold:#FFBC05; --gold-2:#FFD35C; --white:#FFFFFF; --live:#FF3B3B; --ok:#3DDC84;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",Arial,Helvetica,sans-serif; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body)}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(180deg,var(--navy),#00203F);border-bottom:3px solid var(--gold)}
.top img{width:34px;height:34px}
.top h1{margin:0;font:800 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0}
.top h1 small{display:block;font:600 11px/1.3 var(--body);letter-spacing:.12em;color:var(--gold)}
.sync{font:600 12px/1 var(--body);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.saving i{background:var(--gold)} .sync.err{color:#FF8A8A} .sync.err i{background:var(--live)}
.who{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line-2);overflow:hidden;display:grid;place-items:center;font:700 14px var(--display)}
.who img{width:100%;height:100%;object-fit:cover}
main{max-width:640px;margin:0 auto;padding:14px}
.mockbar{background:#5B2A86;color:#fff;text-align:center;font:600 13px var(--body);padding:6px 10px}
h2{font:800 15px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:22px 4px 10px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* sign in */
.hero{text-align:center;padding:48px 12px}
.hero img{width:96px}
.hero h2{font-size:30px;letter-spacing:.04em;color:var(--white);margin:18px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:12px;font:800 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.btn-gold{background:var(--gold);color:var(--navy)} .btn-gold:active{background:var(--gold-2)}
.btn-line{border:2px solid var(--line-2);color:var(--text)} .btn-line:active{background:var(--surface-2)}
.btn-danger{border:2px solid #7A2B2B;color:#FF9C9C}
.btn-block{width:100%}
/* list */
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:76px}
.mrow:active{background:var(--surface-2)}
.mrow.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.gbadge{width:52px;height:52px;border-radius:12px;background:var(--navy);border:1px solid var(--line-2);display:grid;place-items:center;font:800 15px/1 var(--display);letter-spacing:.04em;color:var(--gold);overflow:hidden}
.gbadge img{width:100%;height:100%;object-fit:cover}
.gbadge.has-img{padding:5px;background:var(--navy)} .gbadge.has-img img{width:42px;height:42px;object-fit:contain}
.mrow b{display:block;font:700 19px/1.1 var(--display);letter-spacing:.02em}
.mrow .rv{display:inline-block;margin-top:3px;font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(255,188,5,.5);border-radius:4px;padding:3px 6px}
.mrow .rv.ps{color:var(--navy);background:#fff;border-color:#fff}
.mrow .sub{font-size:14px;color:var(--muted);line-height:1.3;margin-top:3px}
.mrow .st{text-align:right;font:800 22px/1 var(--display)}
.mrow .st small{display:block;font:700 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mrow .st .W{color:var(--gold)} .mrow .st .L{color:var(--muted)}
.pill-live{display:inline-flex;align-items:center;gap:6px;color:#fff;background:var(--live);border-radius:6px;padding:3px 7px;font:800 12px/1 var(--display);letter-spacing:.12em}
.pill-live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.empty{padding:22px;text-align:center;color:var(--muted)}
.fab{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.45);min-height:60px;padding:0 30px;font-size:20px}
.foot{margin:26px 4px 0;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.linkbtn{color:var(--gold);font-weight:600;text-decoration:underline;padding:6px 0}
/* match */
.mhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.back{min-width:48px;min-height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:24px;line-height:1}
.mhead .t{flex:1;min-width:0}
.mhead .t b{display:block;font:800 21px/1.1 var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead .t span{font-size:13.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.seg button{min-height:58px;border-radius:11px;font:800 19px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--line-2)}
.seg button.s-live[aria-pressed="true"]{background:var(--live);color:#fff;box-shadow:none}
.seg button.s-final[aria-pressed="true"]{background:var(--gold);color:var(--navy);box-shadow:none}
.board{margin:12px 0;padding:16px 10px 14px;background:radial-gradient(120% 140% at 50% 0%,var(--navy-2),var(--navy) 60%);border:1px solid var(--line-2);border-radius:18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}
.board .side .nm{font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.board .side.us .nm{color:var(--gold)}
.board .side .full{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:1.2em;padding:0 4px}
.board .num{font:800 84px/0.95 var(--display);font-variant-numeric:tabular-nums;margin-top:6px}
.board .dash{font:800 40px/1 var(--display);color:var(--line-2);padding:0 4px}
.board .meta{grid-column:1/-1;margin-top:10px;font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.board .meta .W{color:var(--gold)}
.panel{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.panel-h b{font:800 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.panel-h span{font-size:13px;color:var(--muted)}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcol{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.pcol .nm{font:800 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pcol.us .nm{color:var(--gold)}
.pcol .v{font:800 64px/1 var(--display);font-variant-numeric:tabular-nums;margin:6px 0 8px}
.pcol .row{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.step{min-height:64px;border-radius:12px;font:800 32px/1 var(--display);background:var(--surface-2);border:1px solid var(--line-2)}
.step.plus{background:var(--gold);color:var(--navy);border:0}
.pcol:not(.us) .step.plus{background:var(--white)}
.step:active{transform:scale(.96)}
.won{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.won button{min-height:62px;border-radius:12px;font:800 17px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--line-2);padding:4px 8px}
.won button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.won button.on.them{background:var(--white);border-color:var(--white)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big2 button{min-height:96px;border-radius:14px;font:800 22px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase}
.big2 .u{background:var(--gold);color:var(--navy)} .big2 .t{background:var(--white);color:var(--navy)}
.big2 button:active{transform:scale(.97)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.chip{flex:none;min-height:46px;padding:6px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);font:700 15px/1.1 var(--display);letter-spacing:.04em;text-align:left}
.chip small{display:block;font:600 11px/1.1 var(--body);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.chip.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.chip.w{color:var(--gold)}
.tools{display:flex;gap:10px;margin-top:12px}
.tools button{flex:1}
.clinch{margin:12px 0;padding:14px;border-radius:16px;background:linear-gradient(90deg,var(--gold),var(--gold-2));color:var(--navy);display:flex;align-items:center;gap:12px}
.clinch b{flex:1;font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.clinch .btn{background:var(--navy);color:var(--white);min-height:50px}
.clinch.them{background:var(--surface-2);color:var(--text)} .clinch.them .btn{background:var(--white);color:var(--navy)}
.rteam{padding:12px 0;border-top:1px solid var(--line)}.rteam:first-of-type{border-top:0}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.rhead b{font:800 18px var(--display);letter-spacing:.04em;text-transform:uppercase}
.rchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rchip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line-2);font-weight:600}
.rchip button{width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}.rchip button:hover{color:var(--text);background:var(--surface-2)}
.radd{flex:1;min-width:180px;min-height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);padding:0 10px}
.tmsg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:rgba(255,188,5,.1);border:1px solid rgba(255,188,5,.4);margin-bottom:8px}.tmsg b{flex:1 1 220px}.tmsg .btn{min-height:40px;padding:0 12px;font-size:14px}
.slab{display:inline-flex;align-items:center;gap:5px}.slab svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rolepick{grid-column:1/-1;display:grid;gap:4px;font-size:12px;color:var(--muted)}.rolepick>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.rbtn{min-width:0;overflow:hidden;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font:700 14px var(--display);letter-spacing:.05em;text-transform:uppercase}
.rbtn img{width:28px;height:28px;flex:none;opacity:.55}.rbtn small{font:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media (max-width:440px){.rbtn small{display:none}}.rbtn.on{border-color:var(--gold);background:rgba(255,188,5,.14);color:var(--text);box-shadow:0 0 0 1px var(--gold) inset}.rbtn.on img{opacity:1}
.hlab{grid-column:1/-1}.hlab.multi{grid-column:auto/span 2}.hlab small{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}.hpick{display:flex;align-items:center;gap:6px;position:relative}.hpick input{flex:1;min-width:0}.hpick img{width:40px;height:40px;border-radius:8px;flex:none;object-fit:cover;background:var(--navy)}
.hbtn{flex:none;width:44px;min-height:44px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--gold);font-size:20px}
.picker{position:fixed;inset:0;z-index:80;background:rgba(0,10,25,.7);display:flex;align-items:flex-end;justify-content:center}
.pk-in{width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line-2);border-radius:18px 18px 0 0;overflow:hidden}
.pk-h{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.pk-h input{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px}
.pk-x{width:46px;font-size:26px;color:var(--muted)}
.pk-grid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:12px}
.pk-grid button{display:grid;gap:4px;justify-items:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 12.5px/1.15 var(--body);text-align:center}
.pk-grid button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.pk-grid img{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--navy)}
.pk-usual{border-bottom:1px solid var(--line);background:var(--surface-2)}.pk-usual>small{display:block;padding:10px 12px 0;font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.pk-usual .pk-grid{overflow:visible}
/* OBS remote */
.remote{margin-top:10px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line-2)}
.remote.off{opacity:.85}
.remote .rh,.povpick .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.remote .rh b,.povpick .rh b{font:800 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.remote .rst,.povpick .rst{display:flex;gap:8px;font:600 12px/1 var(--body);color:var(--muted)}.remote .rst i{font-style:normal}
.remote .rst .on{color:var(--live)}.remote .rst .ok{color:var(--ok)}.remote .rst .warn{color:#FFB35C}
.remote .hint.warn{color:#FFB35C}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.scenes button{position:relative;min-height:64px;padding:8px 10px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);font:800 16px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;text-align:left;display:grid;align-content:center;gap:3px}
.scenes button small{font:700 10px/1 var(--body);letter-spacing:.14em;color:#fff}
.scenes button.air{background:var(--live);border-color:var(--live);color:#fff}
.scenes button.pend{border-color:var(--gold);animation:pendBlink .8s infinite alternate}
@keyframes pendBlink{to{background:rgba(255,188,5,.25)}}
.rrep{min-height:60px;font-size:20px}
.povpick{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line-2)}
.povs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.pv{display:grid;grid-template-columns:1fr auto;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);overflow:hidden}
.pv.air{border-color:var(--live)}
.pvm{min-height:62px;padding:6px 10px;text-align:left;display:grid;align-content:center;gap:3px;font:800 17px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.pvm small{font:700 10px/1 var(--body);letter-spacing:.12em;color:var(--muted)}
.pv.air .pvm{background:var(--live);color:#fff}.pv.air .pvm small{color:#fff}
.pv > span{display:grid;grid-template-rows:1fr 1fr;border-left:1px solid var(--line-2)}
.pvs{width:42px;font:800 15px/1 var(--display);color:var(--muted)}.pvs + .pvs{border-top:1px solid var(--line-2)}
.pvs.on{background:var(--gold);color:var(--navy)}
.pvm.pend,.pvs.pend{animation:pendBlink .8s infinite alternate}
.rtab{overflow-x:auto;margin:6px 0}.rtab table{border-collapse:collapse;min-width:100%}.rtab th{font:700 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}
.rtab td{padding:3px}.rtab td small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.rtab input,.rtab select{width:100%;min-width:58px;min-height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);padding:0 6px}
.rtab td:first-child{min-width:130px}
.seats{display:grid;gap:8px}
.seat{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center}
.seat b{font:800 18px/1 var(--display);color:var(--gold);text-align:center}
.seat input,.seat select{min-height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);padding:0 10px;min-width:0}
.guide{margin-top:12px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:17px}
/* Set desk */
.dpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.dside>small{display:block;font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.dside.us>small{color:var(--gold)}
.dside input{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;margin-bottom:6px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchips button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:700 14px/1 var(--body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchips button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}.dside:not(.us) .dchips button.on{background:var(--white);border-color:var(--white)}
.dgames{display:grid;gap:10px;margin-top:12px}
.drow{border:1px solid var(--line);border-radius:14px;padding:8px 10px 10px;background:var(--bg)}
.drow.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:800 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.dh span{font:600 12px/1 var(--body);letter-spacing:.04em;text-transform:none;color:var(--muted)}.dh .dnow{color:var(--live);font-weight:700}
.dg{display:grid;grid-template-columns:96px 1fr 96px;gap:8px;align-items:stretch}
.dchar{display:grid;justify-items:center;align-content:center;gap:4px;padding:6px 4px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font:700 12px/1.1 var(--body);text-align:center;min-height:96px}
.dchar img{width:56px;height:56px;object-fit:contain}.dchar i{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;border:2px dashed var(--line-2);font:800 22px/1 var(--display);color:var(--muted);font-style:normal}
.dchar.us{border-color:rgba(255,188,5,.55)}
.dwin{display:grid;gap:6px}
.dwin button{min-height:44px;border-radius:10px;border:2px solid var(--line-2);font:800 14px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;overflow:hidden;text-overflow:ellipsis}
.dwin button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}.dwin button.on.them{background:var(--white);border-color:var(--white)}
.dwin button:disabled{opacity:.4}
.drow.done .dchar{min-height:72px}.drow.done .dchar img{width:40px;height:40px}

<body>
<div id="mockbar" class="mockbar" hidden>TEST MODE · scores here are pretend and only on this computer</div>
<header class="top">
  <img src="../../assets/eagle.png" alt="">
  <h1>Scorekeeper<small>HARTLAND ESPORTS</small></h1>
  <span id="sync" class="sync" hidden><i></i><span>Saved</span></span>
  <button id="who" class="who" type="button" hidden aria-label="Account"></button>
</header>
<main id="app"><p class="empty">Loading…</p></main>
<div id="toast" class="toast" hidden role="status"></div>

<script type="module">
import {slug, backend, EDITORS, LEAGUES, STAGES, blankMatch, settle, gameFor, teamLabel, abbrFor, shortSchool, oppShort, rivalFor, roundLabel, postseason, seasonOf, seasonList, termOf, seasonLabel,
  fmtDay, fmtTime, localInput, scoreboardFrom, seasonDocFrom, rollup, listOf, fmtStat, isMock, schoolInfo, scoutKey} from "../../assets/matches.js?v=24";
import {watchFinals} from "../../assets/live.js?v=48";
import {recordBreaks} from "../../assets/records.js?v=5";
import {LAYOUTS as SB_LAYOUTS} from "../../overlay/sbread.js?v=2";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch(e){} };
const SITE = new URL("../../", location.href).href;
function toast(m, ms = 3200){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }

const NOW = seasonOf();  // the current season; "season" below is the one being viewed
let site = {teams:[], games:[]}, be = null, user = null, season = NOW, matches = [], unwatch = null;
let dir = {alumni:[], seasons:[], rosters:{}}, lastEntry = null;
let tick = {messages:[]};
let bc = {stations:{}};   // LevelUP: which match is on each streaming station
let allFinals = null, recDismissed = new Set();   // every final match (for record checks)
let role = null, myTeams = null;   // "coach" | "captain" (student scorekeeper, limited to myTeams)
let view = "list", openId = null, cur = null, draft = null, undo = {}, saveTimer = null, saving = false, dirtyIds = new Set();
const pendingSaves = new Map(); // match id -> latest local copy not yet written

/* ---------- boot ---------- */
(async function boot(){
  if (isMock()) $("#mockbar").hidden = false;
  try { site = await (await fetch(SITE + "data/site.json?v=" + Date.now(), {cache:"no-store"})).json(); } catch(e){}
  try { be = await backend(); }
  catch(e){ $("#app").innerHTML = `<div class="hero"><h2>Can't reach the score database</h2><p class="muted">Check the internet connection and reload.</p></div>`; return; }
  be.onUser(async u => {
    user = u; role = null; myTeams = null;
    /* coaches: everything. Student scorekeepers (approved in Scouting > Members): only their teams' matches. */
    if (u && EDITORS.includes(u.email)) role = "coach";
    else if (u && /@hartlandschools\.us$/i.test(u.email)){ const mem = await be.getMember(u.email);
      if (mem?.scorekeeper && (mem.teams || []).length){ role = "captain"; myTeams = new Set(mem.teams); } }
    renderWho();
    if (unwatch){ unwatch(); unwatch = null; }
    if (role){ unwatch = be.watchSeason(season, onMatches, onState);
      startFinals();
      be.watchBroadcast(b => { bc = {stations:b.stations && typeof b.stations === "object" ? b.stations : {}}; paintRemotes();
        if (view === "list" && !document.activeElement?.closest?.("#stBox")) renderList();
        else if (view === "match" && !document.activeElement?.closest?.("#details")) renderMatch(true); });
      if (!obsWatching && be.watchObs){ obsWatching = true; STATIONS.forEach(n => be.watchObs(n, d => { obs[n] = d; paintRemotes(); })); setInterval(paintRemotes, 15000); }
      be.watchTicker(t => { tick = {messages:Array.isArray(t.messages) ? t.messages : []}; if (view === "list" && !document.activeElement?.closest?.("#tickBox")) renderList(); });
      if (role === "coach") be.watchDirectory(d => { dir = {...d, alumni:Array.isArray(d.alumni) ? d.alumni : [], seasons:Array.isArray(d.seasons) ? d.seasons : [], rosters:d.rosters && typeof d.rosters === "object" ? d.rosters : {}}; if (view === "list") renderList(); }); }
    route();
  });
  window.addEventListener("hashchange", route);
})();

/* Finished matches also live in one "season" summary the public pages read. Rewrite it whenever a final match is touched. */
let finalIds = new Set(); const synced = new Set();
/* The homepage scoreboard only ever holds the current season, so it's left alone while a past season is open. */
const sb = all => season === NOW ? scoreboardFrom(all.filter(m => m.season === NOW), site) : null;
function seasonSum(all, id, nowFinal){ return nowFinal || finalIds.has(id) ? seasonDocFrom(all, season) : null; }
function noteSeason(se){ if (role === "coach" && !dir.seasons.includes(se)){ dir.seasons = [...dir.seasons, se].sort().reverse(); be.saveDirectory(dir).catch(e => console.error(e)); } }
/* Coaches: matches students sent for approval show in the browser tab ("(2) Needs approval"), with a red dot on the
   tab icon, so it's noticed even with the tab in the background. A new one also pops a message. */
const BASE_TITLE = document.title; let seenReview = null, iconHref = null;
function reviewAlert(){
  if (role !== "coach") return;
  const list = matches.filter(m => m.status === "review"), n = list.length;
  document.title = n ? `(${n}) Needs approval · Scorekeeper` : BASE_TITLE;
  const link = document.querySelector('link[rel~="icon"]');
  if (link){ iconHref = iconHref || link.href;
    if (!n) link.href = iconHref;
    else { const img = new Image(); img.crossOrigin = "anonymous"; img.onload = () => { try { const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
      x.drawImage(img, 0, 0, 64, 64); x.fillStyle = "#FF3B3B"; x.beginPath(); x.arc(48, 16, 15, 0, 7); x.fill(); x.strokeStyle = "#fff"; x.lineWidth = 3; x.stroke(); link.href = c.toDataURL("image/png"); } catch(e){} }; img.src = iconHref; } }
  const ids = new Set(list.map(m => m.id));
  if (seenReview){ const fresh = list.filter(m => !seenReview.has(m.id)); if (fresh.length) toast(`${fresh[0].teamName} vs ${oppName(fresh[0])} needs your approval.`, 6000); }
  seenReview = ids;
}
function setSeason(se){
  if (se === season) return;
  if (pendingSaves.size) flush();
  season = se; matches = []; finalIds = new Set();
  if (unwatch) unwatch();
  unwatch = be.watchSeason(season, onMatches, onState);
}
function onMatches(list, meta){
  finalIds = new Set(list.filter(m => m.status === "final").map(m => m.id));
  if (!synced.has(season) && meta && !meta.fromCache && !pendingSaves.size && user && role === "coach"){
    const se = season, all = list.map(m => settle({...m})); synced.add(se);
    be.syncSummaries(sb(all), seasonDocFrom(all, se)).then(() => { if (finalIds.size) noteSeason(se); }).catch(e => { synced.delete(se); console.error(e); });
  }
  matches = list.map(m => settle(pendingSaves.get(m.id) || m));
  reviewAlert();
  if (cur && !dirtyIds.has(cur.id)){ const fresh = matches.find(m => m.id === cur.id); if (fresh) cur = clone(fresh); }
  if (view === "list") renderList();
  else if (view === "match") renderMatch(true);
}
function onState(s){
  const el = $("#sync"); el.hidden = false;
  if (s.error){ el.className = "sync err"; el.lastChild.textContent = "Offline"; return; }
  if (saving || s.pending){ el.className = "sync saving"; el.lastChild.textContent = navigator.onLine ? "Saving…" : "Saved on phone · will sync"; }
  else { el.className = "sync"; el.lastChild.textContent = "Saved"; }
}
window.addEventListener("online", () => onState({pending:dirtyIds.size > 0}));
window.addEventListener("offline", () => onState({pending:true}));

function renderWho(){
  const w = $("#who");
  if (!user){ w.hidden = true; return; }
  w.hidden = false; w.innerHTML = user.photo ? `<img src="${esc(user.photo)}" alt="" referrerpolicy="no-referrer">` : esc((user.name || "?")[0]);
  w.onclick = () => { if (confirm(`Signed in as ${user.email}.\n\nSign out?`)) be.signOut(); };
}

function route(){
  const h = location.hash.slice(1);
  if (!user) return renderSignIn();
  if (!role) return renderNotAllowed();
  /* a student scorekeeper can only open their own teams' matches */
  const mineOnly = id => role === "coach" || myTeams.has((matches.find(x => x.id === id) || {}).teamId);
  if ((h.startsWith("m/") && matches.length && !mineOnly(h.slice(2))) || (h.startsWith("edit/") && !mineOnly(h.slice(5)))){ toast("That match isn't one of your teams'."); location.hash = ""; return; }
  if (h === "new"){ view = "form"; openId = null; draft = newDraft(); return renderForm(); }
  if (h.startsWith("edit/")){ const m = matches.find(x => x.id === h.slice(5)); view = "form"; openId = h.slice(5); draft = m ? clone(m) : null; if (!m){ location.hash = ""; return; } return renderForm(); }
  if (h.startsWith("m/")){ view = "match"; if (openId !== h.slice(2) || !cur){ statTab = null; openId = h.slice(2); const m = matches.find(x => x.id === openId); cur = m ? clone(m) : null; } return renderMatch(); }
  if (pendingSaves.size) flush();
  view = "list"; openId = null; cur = null; renderList();
}

/* A new match starts from the last one you entered (same team, league and date), which makes entering a past season quick. */
function newDraft(){
  const L = lastEntry && seasonOf(lastEntry.startsAt) === season ? lastEntry : null;
  let when; if (L) when = L.startsAt; else if (season !== NOW){ const d = new Date(+season.slice(0, 4), 9, 1, 15, 30); when = d.toISOString(); }
  const team = (site.teams || []).find(t => t.id === (L ? L.teamId : "")) || (L ? null : (site.teams || [])[0]);
  const d = blankMatch(site, team, when);
  if (L){ d.league = L.league; d.stage = L.stage; d.bestOf = L.bestOf; if (!L.teamId){ d._past = true; d.teamId = ""; d.teamName = L.teamName; d.game = L.game; d.level = L.level; d.gameName = gameFor(site, L.game).name; } }
  return d;
}

/* ---------- sign in ---------- */
function renderSignIn(){
  $("#app").innerHTML = `<div class="hero"><img src="../../assets/eagle.png" alt=""><h2>Coaches only</h2>
    <p class="muted" style="max-width:340px;margin:0 auto 26px">Sign in with your hartlandschools.us Google account to enter scores. You stay signed in on this phone.</p>
    <button class="btn btn-gold" id="signin" type="button">Sign in with Google</button></div>`;
  $("#signin").onclick = async () => { try { await be.signIn(); } catch(e){ toast(/popup-closed|cancelled/.test(e.code || "") ? "Sign-in was closed." : "Couldn't sign in. " + (e.code || e.message || "")); } };
}
function renderNotAllowed(){
  $("#app").innerHTML = `<div class="hero"><h2>Not a scorekeeper account</h2><p class="muted">${esc(user.email)} can't enter scores yet. A coach can turn on <b>Scorekeeper</b> for you in Scouting → Members, with the teams you score.</p>
    <button class="btn btn-line" id="so" type="button">Sign out</button></div>`;
  $("#so").onclick = () => be.signOut();
}

/* ---------- list ---------- */
function gameBadge(m){
  const g = gameFor(site, m.game);
  return `<span class="gbadge${g.icon ? " has-img" : ""}">${g.icon ? `<img src="${esc(/^https?:/.test(g.icon) ? g.icon : SITE + g.icon)}" alt="">` : esc(g.abbr || (g.short || "?").slice(0, 3))}</span>`;
}
function oppName(m){ return oppShort(m); }
function rowHTML(m){
  const live = m.status === "live", fin = m.status === "final";
  const st = live ? `${m.score.us}–${m.score.them}<small><span class="pill-live">LIVE</span></small>`
    : fin ? (m.bye ? `<span class="W">W</span> Bye<small>Auto win</small>` : `<span class="${m.result}">${m.result}</span> ${m.score.us}–${m.score.them}<small>Final${m.forfeit ? " · FF" : ""}</small>`)
    : m.status === "review" ? `${m.score.us}–${m.score.them}<small>Needs approval</small>`
    : m.status === "postponed" ? `<small>Postponed</small>` : m.status === "canceled" ? `<small>Canceled</small>`
    : `${esc(fmtTime(m.startsAt))}<small>${esc(fmtDay(m.startsAt))}</small>`;
  return `<button class="mrow${live ? " live" : ""}" type="button" data-open="${esc(m.id)}">${gameBadge(m)}

function renderList(){

/* Stream ticker announcements (public/ticker). The ticker overlay shows these the moment they're saved. */

function bindTicker(){
  if (!$("#tGo")) return;
  const save = async msgs => { tick = {messages:msgs, updated:new Date().toISOString()}; try { await be.saveTicker(tick); renderList(); } catch(e){ toast("Couldn't update the ticker. Check the connection."); } };
  $("#tGo").onclick = () => { const text = $("#tText").value.trim(); if (!text){ $("#tText").focus(); return; }
    const mins = +$("#tFor").value, until = mins ? new Date(Date.now() + mins * 6e4).toISOString() : "";
    save([...activeMsgs().filter(x => !($("#tPin").checked && x.pinned)), {id:Date.now().toString(36), text, pinned:$("#tPin").checked, until, at:new Date().toISOString(), by:user?.email || ""}]); toast("On the ticker."); };
  document.querySelectorAll(".tdel").forEach(b => b.onclick = () => save(activeMsgs().filter(x => x.id !== b.dataset.tid)));

function bindShow(box){
  box.querySelectorAll("[data-showbox]").forEach(el => {

    const read = () => { const v = k => el.querySelector(`[data-sh="${k}"]`)?.value || "", all = everyone(), pick = id => { const p = all.get(id); return p ? {id:p.id, name:p.private ? "" : (p.name || ""), tag:p.tag || ""} : null; };

      const was = cur().show || {}; put({...r, on:true, won:was.on ? (was.won || [0, 0]) : [0, 0], started:was.on ? (was.started || Date.now()) : Date.now()}, was.on ? "Showmatch updated." : `Showmatch on station ${n}.`); };

    const rs = el.querySelector("[data-shreset]"); if (rs) rs.onclick = () => put({...cur().show, won:[0, 0], started:Date.now()}, "Series reset to 0–0.");
    const off = el.querySelector("[data-shoff]"); if (off) off.onclick = () => put({...cur().show, on:false, won:[0, 0]}, `Showmatch ended. Station ${n} is back on its match.`);
  });
}
function bindCopy(root){ root.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast("Link copied."); } catch(e){ prompt("Copy this link:", b.dataset.copy); } }); }
/* ---------- LevelUP Remote: run OBS on a streaming PC from here ----------
   The LevelUP Remote browser source inside OBS (overlay/remote.html) reports that PC's scenes to obsState/{station}
   and carries out commands put on the station: switch scene, instant replay. */
let obs = {}, obsWatching = false;
/* Student scorekeepers only touch stations that are showing their own team's match (or nothing yet), so a player
   running Smash can't switch scenes on the Fortnite PC. Coaches can run every station. */
const stationMine = n => { if (role === "coach") return true; const id = bc.stations[n]?.matchId; if (!id) return !bc.stations[n]?.show?.on; const m = matches.find(x => x.id === id); return !!m && myTeams.has(m.teamId); };
const obsLive = n => { const o = obs[n]; return !!o && Date.now() - new Date(o.at).getTime() < 60000; };
function remoteHTML(n){
  const o = obs[n];
  if (!obsLive(n)) return `<div class="remote off"><div class="rh"><b>OBS remote · Station ${n}</b><span class="rst">Not connected</span></div>
    <p class="hint" style="margin:6px 0 0">To switch scenes from here, add the <b>LevelUP Remote</b> Browser Source in OBS on that PC (Page permissions: <i>Advanced access to OBS</i>; <i>Shutdown source when not visible</i> off).
    <button type="button" class="linkbtn" data-copy="${esc(overlayURL("remote", n))}">Copy its link</button> · <a class="linkbtn" href="stream-guide.html#remote">How to set it up</a></p></div>`;
  const scenes = String(o.scenes || "").split("\n").filter(Boolean);
  return `<div class="remote"><div class="rh"><b>OBS remote · Station ${n}</b><span class="rst">${o.streaming ? `<i class="on">● Live</i>` : `<i>Not streaming</i>`}${o.recording ? `<i class="on">● Rec</i>` : ""}<i class="${o.replayBuffer ? "ok" : "warn"}">Replays ${o.replayBuffer ? "ready" : "off"}</i></span></div>
    ${+o.level < 4 ? `<p class="hint warn" style="margin:6px 0">OBS won't let it switch scenes yet. In OBS: the LevelUP Remote source &gt; Properties &gt; Page permissions &gt; <b>Advanced access to OBS</b>.</p>` : ""}
    <div class="scenes">${scenes.map(sc => `<button type="button" data-scene="${esc(sc)}" data-rn="${n}" class="${sc === o.current ? "air" : ""}"${sc === o.current ? ' aria-current="true"' : ""}>${sc === o.current ? `<small>On air</small>` : ""}${esc(sc)}</button>`).join("")}</div>
    <button type="button" class="btn btn-gold btn-block rrep" data-rrep="${n}">⟲ Instant replay</button>
    ${bc.stations[n]?.reader?.on ? `<button type="button" class="btn btn-line btn-block" style="margin-top:8px" data-rread="${n}">Read the scoreboard now</button>${o.reader ? `<p class="hint" style="margin:6px 0 0">${esc(o.reader)}</p>` : ""}` : ""}</div>`;
}
async function sendCmd(n, cmd, msg){
  const id = Math.random().toString(36).slice(2, 10);
  await setStation(n, {...bc.stations[n], cmd:{id, at:new Date().toISOString(), ...cmd}}, msg); buzz();
}
/* Instant replay: through the remote in OBS when it's running, otherwise through the overlays and the relay. */
async function instantReplay(n){
  const st = bc.stations[n] || {}, scene = st.replayScene ?? RP_SCENE, back = +(st.replayBack ?? 15);
  if (obsLive(n)) return sendCmd(n, {type:"replay", scene, back}, scene ? `Replay saved. Cutting to ${scene}.` : "Replay saved.");
  await setStation(n, {...st, replay:{id:Math.random().toString(36).slice(2, 10), at:new Date().toISOString(), label:"Replay", scene, back}},
    scene ? `Saving the replay. The stream cuts to ${scene} in a moment.` : "Saving the replay on the streaming PC."); buzz();
}
/* ---------- POV picker: whose camera is on stream ----------
   Each gaming PC is a "seat" with its own OBS source (usually NDI), named "POV 1", "POV 2"… by default. On stream it's set
   which player sits at which seat (lineup order to start). Tapping a player shows their seat's source full screen (or
   in the left / right window of the Two POVs and Replay + Live scenes), and the POV name plates follow. */
const seatSrcs = st => { const n = Math.max(1, Math.min(6, +st.seatsN || 0)); return Array.from({length:n}, (_, i) => String(st.seatSrc?.[i] || `POV ${i + 1}`)); };
function seatsOf(n){
  const st = bc.stations[n] || {}, m = matches.find(x => x.id === st.matchId), ppl = m?.players || [];
  if (!+st.seatsN) return [];
  return seatSrcs(st).map((src, i) => { const pid = st.seatPid?.[i] ?? ppl[i]?.id ?? ""; const p = ppl.find(x => x.id === pid) || everyone().get(pid); return {i, src, pid, name:p ? (p.tag || p.name || "Player") : ""}; });
}
function povHTML(n){
  const seats = seatsOf(n).filter(x => x.pid); if (!seats.length) return "";
  const pv = bc.stations[n]?.pov || {};
  return `<div class="povpick"><div class="rh"><b>Cameras (POV)</b><span class="rst"><i>Tap a name for full screen · L / R for split screens</i></span></div>
    <div class="povs">${seats.map(x => `<div class="pv${pv.main === x.pid ? " air" : ""}"><button type="button" class="pvm" data-pov="main" data-seat="${x.i}" data-rn="${n}">${pv.main === x.pid ? `<small>On screen</small>` : `<small>${esc(x.src)}</small>`}${esc(x.name)}</button>
      <span><button type="button" class="pvs${pv.left === x.pid ? " on" : ""}" data-pov="left" data-seat="${x.i}" data-rn="${n}" aria-label="${esc(x.name)} in the left window">L</button><button type="button" class="pvs${pv.right === x.pid ? " on" : ""}" data-pov="right" data-seat="${x.i}" data-rn="${n}" aria-label="${esc(x.name)} in the right window">R</button></span></div>`).join("")}</div></div>`;
}
async function pickPov(n, side, i){
  const st = bc.stations[n] || {}, seats = seatsOf(n), x = seats[i]; if (!x) return;
  const id = Math.random().toString(36).slice(2, 10);
  await setStation(n, {...st, pov:{...(st.pov || {}), [side]:x.pid}, cmd:{id, at:new Date().toISOString(), type:"pov", [side]:x.src, seats:seats.map(y => y.src)}}); buzz();
}
function paintRemotes(){
  const sum = $("#remoteSec > summary > span"), sn = cur && stationOf(cur.id);
  if (sum && sn) sum.textContent = obsLive(sn) ? `On air: ${obs[sn].current || ""}` : "Not connected";
  document.querySelectorAll(".remoteBox[data-rn]").forEach(box => {
    const n = box.dataset.rn, h = stationMine(n) ? remoteHTML(n) + povHTML(n) : `<p class="hint" style="margin:8px 0 0">Station ${n} is streaming another team's match, so its remote is for coaches.</p>`; if (box._h === h) return; box._h = h; box.innerHTML = h;
    box.querySelectorAll("[data-scene]").forEach(b => b.onclick = () => { if (b.classList.contains("air")) return;
      box.querySelectorAll("[data-scene]").forEach(x => x.classList.remove("air", "pend")); b.classList.add("pend");

/* Playoff eligibility (league rules: 8-week regular season with one mandatory rest week, so 7 matches at most;
   5 played to make playoffs, so a team can forfeit twice). A bye week counts as a played match (it's an automatic win);
   a match Hartland forfeited does not. Numbers can be changed in site.json under leagueRules. */
function playoffHTML(open){
  if (season !== NOW) return "";
  const R = {league:"MHSEL", minPlayed:5, maxPlayed:7, ...(site.leagueRules || {})}, term = termOf(new Date().toISOString());
  const reg = matches.filter(m => m.status === "final" && (m.stage || "regular") === "regular" && (m.term || termOf(m.startsAt)) === term && String(m.league || "").toLowerCase().includes(String(R.league).toLowerCase()));
  const teams = [...new Set(reg.map(m => m.teamName))].sort();
  if (!teams.length) return "";
  const rows = teams.map(t => { const l = reg.filter(m => m.teamName === t), ff = l.filter(m => m.forfeit === "us").length, played = l.length - ff, need = Math.max(0, R.minPlayed - played);
    return `<li><b>${esc(t)}</b><span>${played} played${ff ? ` · ${ff} forfeit${ff === 1 ? "" : "s"}` : ""}</span><em class="${need ? "" : "ok"}">${need ? `${need} more to qualify` : "✓ Playoff eligible"}</em></li>`; }).join("");
  return `<details class="sec" id="poBox"${open ? " open" : ""}><summary>Playoff eligibility<span>${esc(term === "fall" ? "Fall" : "Spring")} season</span></summary><div class="secb">
    <p class="hint" style="margin:0 0 8px">${esc(R.league)} teams need ${R.minPlayed} played matches (of ${R.maxPlayed}) to make playoffs. Bye weeks count as played wins; rest weeks aren't entered; matches we forfeit don't count.</p>

}

async function mergePlayers(drop, keep, D){
    const K = everyone().get(keep) || {id:keep};
    try {
      const seasons = [...new Set([...seasonList(dir.seasons), season])];
      let moved = 0; const touched = [];
      for (const se of seasons){
        const list = await be.getSeason(se), changed = [];
        list.forEach(m0 => {
          if (!JSON.stringify(m0).includes(drop)) return;
          const m = clone(m0), g = gameFor(site, m.game);
          const pk = (m.players || []).find(p => p.id === keep), pd = (m.players || []).find(p => p.id === drop);
          if (pd){ m.players = m.players.filter(p => p.id !== drop);
            if (!pk) m.players.push({...pd, ...snap(K, pd.sub ? {sub:true} : null), stats:pd.stats || {}, ...(pd.games ? {games:pd.games} : {})}); }
          (m.games || []).forEach(x => { if (x.p && x.p[drop]){ if (!x.p[keep]) x.p[keep] = x.p[drop]; delete x.p[drop]; } });
          rollup(m, g); settle(m); changed.push(m);
        });
        if (changed.length){
          await be.saveMany(changed, user?.email); moved += changed.length;
          const merged = list.map(m => changed.find(c => c.id === m.id) || m);
          await be.syncSummaries(se === season ? sb(matches.map(m => changed.find(c => c.id === m.id) || m)) : null, seasonDocFrom(merged, se));
          touched.push([se, merged]);
        }

      const ro = {}; Object.entries(dir.rosters || {}).forEach(([k, ids]) => { ro[k] = [...new Set((ids || []).map(id => id === drop ? keep : id))]; });

    } catch(e){ console.error(e); toast("Couldn't finish the merge. Check the connection and try again (it's safe to repeat)."); return false; }
}

/* ---------- record-breaking announcements ----------
   Every entry is checked against the record book worked out from all final matches. When an entry takes a record
   from someone else, the match screen offers "Record broken: fire it?" (never automatic: plays get overturned and
   stats get mis-typed). Firing shows a splash on the stream this match is on and a BREAKING line on every other
   stream's ticker. Each record + holder is announced once per match, so corrections don't announce twice. The
   record book itself only changes when the match is marked final. */
function startFinals(){
  if (allFinals !== null) return; allFinals = [];
  watchFinals(site, f => { allFinals = f; if (view === "match" && !document.activeElement?.closest?.("#details")) renderMatch(true); });
}
function recWho(){
  const all = everyone(), seen = {}, cur = new Set((site.teams || []).flatMap(t => (t.roster || []).map(r => r.id)).filter(Boolean));
  (allFinals || []).forEach(m => (m.players || []).forEach(p => { if (p.id && !seen[p.id]) seen[p.id] = p; }));
  return {name:id => { const p = all.get(id) || seen[id] || {}; return p.private || !p.name ? (p.tag || "Player") : p.name; }, current:id => cur.has(id)};
}
function pendingRecords(m){
  if (!allFinals || !allFinals.length) return [];
  try { return recordBreaks(site, allFinals, m, recWho()).filter(r => (m.announced || {})[r.key] !== r.holder.id && !recDismissed.has(r.key + "|" + r.holder.id + "|" + r.value)); }
  catch(e){ console.error(e); return []; }
}
function recordHTML(m){
  const list = pendingRecords(m); if (!list.length) return "";
  const g = gameFor(site, m.game), n = stationOf(m.id);
  return list.map((r, i) => `<div class="recbrk" data-ri="${i}"><div><b>🏆 Record broken: fire it?</b>
    <span>${esc(r.holder.name)}: ${esc(r.game ? (g.short || g.name) + " " : "")}${esc(r.title.toLowerCase())}, <strong>${esc(r.display)}</strong> (was ${esc(r.prev.name)}, ${esc(r.prev.display)})</span>
    <small>${n ? `Splash on station ${n}, BREAKING on the other streams' tickers.` : "This match isn't on a stream station, so it goes on the tickers only."} It joins the record book when the match is final.</small></div>
    <div class="recbtns"><button class="btn btn-gold" type="button" data-fire="${i}">Fire it</button><button class="btn btn-line" type="button" data-skip="${i}">Not now</button></div></div>`).join("");
}
async function fireRecord(r){
  const g = gameFor(site, cur.game), n = stationOf(cur.id), gname = r.game ? (g.short || g.name) : "";
  const text = `BREAKING: ${r.holder.name} breaks the Hartland ${gname ? gname + " " : ""}record for ${r.title.toLowerCase()} (${r.display})`;
  change(m => { m.announced = {...(m.announced || {}), [r.key]:r.holder.id}; }, true);
  try {
    if (n) await setStation(n, {...freshStation(cur.id), ...bc.stations[n], splash:{id:Date.now().toString(36), holder:r.holder.name, title:r.title, game:gname, display:r.display, prev:r.prev, at:new Date().toISOString()}});
    tick = {messages:[...activeMsgs(), {id:Date.now().toString(36), text, pinned:false, until:new Date(Date.now() + 10 * 6e4).toISOString(), at:new Date().toISOString(), by:user?.email || "", skipStation:n || "", kind:"record"}], updated:new Date().toISOString()};
    await be.saveTicker(tick);
    toast(n ? "Fired: splash on the stream, BREAKING on the other tickers." : "Fired: BREAKING on the stream tickers.");
  } catch(e){ console.error(e); toast("Couldn't reach the stream overlays. Check the connection."); }
}

async function cmpScout(n, name){
  if (!be.scoutFor) return;
  try {
    const r = await be.scoutFor(cur.game, cur.opponent?.school || cur.opponent?.team || ""), k = String(name).toLowerCase().replace(/[^a-z0-9]/g, "");
    const rows = (r?.statGames || []).flatMap(x => (x.players || []).filter(p => String(p.tag || "").toLowerCase().replace(/[^a-z0-9]/g, "") === k));
    const role = (r?.players || []).find(p => String(p.tag || "").toLowerCase().replace(/[^a-z0-9]/g, "") === k)?.role || "";
    const sum = {}; rows.forEach(p => Object.entries(p).forEach(([key, v]) => { if (key !== "tag" && !isNaN(+v)) sum[key] = (sum[key] || 0) + (+v); }));
    const avg = rows.length ? Object.fromEntries(Object.entries(sum).map(([key, v]) => [key, Math.round(v / rows.length * 10) / 10])) : null;
    const cc = {}; rows.forEach(p => { if (p.char) cc[p.char] = (cc[p.char] || 0) + 1; });
    const main = Object.entries(cc).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
    const st = bc.stations[n]; if (!st || st.compare?.them !== name) return;
    await setStation(n, {...st, compare:{...st.compare, themStats:avg, themGp:rows.length, themRole:role, themMain:main}});
  } catch(e){ console.error(e); }
}

function queueSave(){
  if (!cur) return;
  dirtyIds.add(cur.id); pendingSaves.set(cur.id, settle(rollup(clone(cur), gameFor(site, cur.game)))); onState({pending:true});
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 350);
}
async function flush(){
  clearTimeout(saveTimer);
  for (const [id, m] of [...pendingSaves]){
    pendingSaves.delete(id);
    matches = matches.filter(x => x.id !== id).concat([m]);
    saving = true;
    try { await be.save(m, sb(matches), user?.email, seasonSum(matches, id, m.status === "final")); if (m.status === "final"){ finalIds.add(id); noteSeason(season); } if (!pendingSaves.has(id)) dirtyIds.delete(id); }
    catch(e){ console.error(e); if (!pendingSaves.has(id)) pendingSaves.set(id, m);
      toast(/permission/i.test(e.code || e.message || "") ? "This account isn't allowed to change scores." : "Couldn't save. Check the connection; it'll retry on the next tap."); }
    saving = false;
  }
  onState({pending:dirtyIds.size > 0});
}
window.addEventListener("pagehide", () => { if (pendingSaves.size) flush(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && pendingSaves.size) flush(); });

/* ---------- create / edit form ---------- */
function myLeagues(){ try { return (JSON.parse(localStorage.getItem("eagles-leagues") || "[]") || []).filter(x => typeof x === "string"); } catch(e){ return []; } }
function renderForm(){
  if (!draft){ location.hash = ""; return; }
  const teams = (site.teams || []).filter(t => role === "coach" || myTeams.has(t.id));
  const known = site.teamSchools || {};
  const schools = [...new Set([...(site.highSchools || []).map(x => x.name), ...Object.values(known), ...matches.map(m => m.opponent?.school).filter(Boolean)].filter(Boolean))].sort();
  const oppTeams = [...new Set([...Object.keys(known), ...matches.map(m => m.opponent?.team).filter(Boolean)])].sort();
  const past = !!draft._past || (!!openId && !draft.teamId) || (!teams.some(t => t.id === draft.teamId) && !!draft.teamName && !!openId);
  const team = past ? {} : (teams.find(t => t.id === draft.teamId) || {});
  const leagues = [...new Set([...String(team.leagues || "").split(",").map(s => s.trim()).filter(Boolean), ...LEAGUES, ...String(site.program?.leagues || "").split(",").map(s => s.trim()), ...myLeagues(), ...matches.map(m => m.league), draft.league].filter(Boolean))];
  const isNew = !openId;
  $("#app").innerHTML = `<div class="mhead"><button class="back" type="button" id="cancel1" aria-label="Back">←</button><div class="t"><b>${isNew ? "New match" : "Edit match"}</b><span>${esc(seasonLabel(draft.season))} season</span></div></div>
    <form class="form" id="mf" autocomplete="off">
      <label class="f"><span>Our team</span><select name="teamId" required>${teams.map(t => `<option value="${esc(t.id)}"${!past && t.id === draft.teamId ? " selected" : ""}>${esc(teamLabel(site, t))}</option>`).join("")}${role === "coach" ? `<option value="__past"${past ? " selected" : ""}>A past team (not on this list)…</option>` : ""}</select></label>
      ${past ? `<label class="f"><span>Past team name</span><input name="pastName" list="pastTeams" value="${esc(draft.teamName || "")}" placeholder="Valorant Varsity" required></label>
      <div class="two"><label class="f"><span>Game</span><select name="pastGame">${(site.games || []).map(g => `<option value="${esc(g.key)}"${g.key === draft.game ? " selected" : ""}>${esc(g.name)}</option>`).join("")}<option value=""${draft.game ? "" : " selected"}>Another game</option></select></label>
        <label class="f"><span>Level</span><select name="pastLevel">${["Varsity", "JV"].map(l => `<option${l === draft.level ? " selected" : ""}>${l}</option>`).join("")}</select></label></div>
      <p class="hint">For a game we no longer play, add it on the Games tab in the Site Manager first so it scores correctly.</p>
      <datalist id="pastTeams">${[...new Set(matches.filter(m => !m.teamId).map(m => m.teamName).filter(Boolean))].map(n => `<option value="${esc(n)}">`).join("")}</datalist>` : ""}
      ${team.id && !team.gameKey ? `<p class="hint" style="color:var(--gold)">This team has no game type yet. Set it on the Teams tab in the Site Manager so scoring works right.</p>` : ""}
      <label class="tog" style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" name="bye"${draft.bye ? " checked" : ""}> Bye week: no opponent was available (counts as an automatic win)</label>
      <label class="f"><span>Opponent team name</span><input name="oppTeam" list="oppTeams" value="${esc(draft.opponent?.team || "")}" placeholder="Denby Tars"></label>
      <label class="f"><span>Opponent school</span><input name="oppSchool" list="schools" value="${esc(draft.opponent?.school || "")}" placeholder="Denby High School"></label>
      <p class="hint" id="libHint"${schoolInfo(site, draft.opponent?.school) ? "" : " hidden"}>✓ In the School library: logo and short name fill in on the overlays.</p>
      <div class="two">
        <label class="f"><span>Short name (optional)</span><input name="abbr" maxlength="24" value="${esc(draft.opponent?.short || "")}" placeholder="${esc(shortSchool(draft.opponent?.school || "") || "Novi")}"></label>
        <label class="f"><span>Best of</span><select name="bestOf">${[1, 3, 5, 7].map(n => `<option${n === +draft.bestOf ? " selected" : ""}>${n}</option>`).join("")}</select></label>
      </div>
      <label class="f"><span>Date & time</span><input type="datetime-local" name="when" value="${esc(localInput(draft.startsAt))}" required></label>
      <div class="two">
        <label class="f"><span>League / event</span><select name="league" id="leagueSel">${leagues.map(l => `<option${l === draft.league ? " selected" : ""}>${esc(l)}</option>`).join("")}<option value="__new">＋ Add a league or event…</option></select></label>
        <label class="f"><span>Stage</span><select name="stage">${STAGES.map(([v, l]) => `<option value="${v}"${v === draft.stage ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      </div>
      <div class="two">
        <label class="f"><span>Week or round</span><input name="week" list="rounds" value="${esc(draft.week || "")}" placeholder="3, or Round of 32"></label>
        <datalist id="rounds">${["Round of 64", "Round of 32", "Round of 16", "Quarterfinal", "Semifinal", "State Final", "Third-place match"].map(r => `<option value="${r}">`).join("")}</datalist>
        <label class="f"><span>Event name (optional)</span><input name="event" value="${esc(draft.event || "")}" placeholder="State quarterfinal"></label>
      </div>
      <label class="f"><span>YouTube live link</span><input type="url" name="live" inputmode="url" value="${esc(draft.stream?.live || "")}" placeholder="https://youtube.com/live/…"></label>
      <label class="f"><span>Notes</span><textarea name="notes" rows="2">${esc(draft.notes || "")}</textarea></label>
      ${isNew ? "" : `<label class="f"><span>Status</span><select name="status">${["upcoming", "live", "final", "postponed", "canceled"].map(s => `<option value="${s}"${s === draft.status ? " selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("")}</select></label>
        ${role === "coach" ? `<button class="btn btn-danger" type="button" id="del">Delete this match</button>` : ""}`}
      <datalist id="schools">${schools.map(s => `<option value="${esc(s)}">`).join("")}</datalist>
      <datalist id="oppTeams">${oppTeams.map(s => `<option value="${esc(s)}">`).join("")}</datalist>
      <div class="formbar"><button class="btn btn-line" type="button" id="cancel2">Cancel</button><button class="btn btn-gold" type="submit">${isNew ? "Create match" : "Save"}</button></div>
    </form>`;
  const F = $("#mf");
  const cancel = () => location.hash = openId ? "m/" + openId : "";
  $("#cancel1").onclick = cancel; $("#cancel2").onclick = cancel;
  { const sel = $("#leagueSel"); let last = sel.value;
    sel.onchange = () => { if (sel.value !== "__new"){ last = sel.value; return; }
      const name = (prompt("Name of the league or event (for example: PlayVS Cup)") || "").trim().slice(0, 60);
      if (!name){ sel.value = last; return; }
      let o = [...sel.options].find(x => x.value.toLowerCase() === name.toLowerCase());
      if (!o){ o = new Option(name, name); sel.add(o, sel.options[sel.options.length - 1]); try { localStorage.setItem("eagles-leagues", JSON.stringify([...new Set([...myLeagues(), name])])); } catch(e){} }
      sel.value = last = o.value; }; }
  F.teamId.onchange = () => { const isPast = F.teamId.value === "__past", t = teams.find(x => x.id === F.teamId.value); const keep = {opponent:readOpp(F), startsAt:readWhen(F) || draft.startsAt, stream:{live:F.live.value.trim(), vod:draft.stream?.vod || ""}, notes:F.notes.value, week:F.week.value};
    const nb = blankMatch(site, t, keep.startsAt); draft = {...draft, ...nb, ...keep, status:draft.status, games:draft.games, players:isNew ? [] : draft.players, _past:isPast};
    if (isPast){ draft.teamId = ""; draft.teamName = ""; draft.game = (site.games || [])[0]?.key || ""; } renderForm(); };
  if (F.pastGame) F.pastGame.onchange = () => { const g = gameFor(site, F.pastGame.value); if (g.bestOf) F.bestOf.value = String(g.bestOf); };
  F.oppTeam.onchange = () => { const k = Object.keys(known).find(n => n.toLowerCase() === F.oppTeam.value.trim().toLowerCase()); if (k && !F.oppSchool.value){ F.oppSchool.value = known[k]; F.abbr.placeholder = shortSchool(known[k]); } };
  F.oppSchool.oninput = () => { const lib = schoolInfo(site, F.oppSchool.value); F.abbr.placeholder = lib?.short || shortSchool(F.oppSchool.value) || "Novi"; $("#libHint").hidden = !lib; };
  if (!isNew && $("#del")) $("#del").onclick = async () => {
    if (!confirm("Delete this match for good?")) return;
    try { await be.remove(openId, sb(matches.filter(m => m.id !== openId)), seasonSum(matches.filter(m => m.id !== openId), openId, false)); toast("Match deleted."); cur = null; location.hash = ""; }
    catch(e){ toast("Couldn't delete: " + (e.code || e.message)); }
  };
  F.onsubmit = async e => {
    e.preventDefault();
    const when = readWhen(F); if (!when){ toast("Pick a date and time."); return; }
    const isPast = F.teamId.value === "__past";
    if (isPast && !F.pastName.value.trim()){ toast("Type the past team's name."); return; }
    const t = isPast ? {id:"", level:F.pastLevel.value} : (teams.find(x => x.id === F.teamId.value) || {}), g = gameFor(site, isPast ? F.pastGame.value : t.gameKey);
    const m = {...draft, teamId:t.id || "", teamName:isPast ? F.pastName.value.trim() : teamLabel(site, t), game:g.key || "", gameName:(isPast && !F.pastGame.value) ? "" : (g.name || t.game || ""), level:t.level || "Varsity",
      opponent:readOpp(F), startsAt:when, season:seasonOf(when), term:termOf(when), bestOf:+F.bestOf.value, league:F.league.value, stage:F.stage.value,
      week:F.week.value.trim(), event:F.event.value.trim(), stream:{...(draft.stream || {}), live:F.live.value.trim()}, notes:F.notes.value.trim()};
    if (!isNew) m.status = F.status.value;
    m.bye = F.bye.checked;
    if (m.bye){ m.status = "final"; m.opponent = {school:"", team:"Bye", short:"Bye", abbr:"BYE", logo:""}; m.players = []; }
    delete m._past;
    m.id = openId || be.newId();
    settle(m);
    const all = matches.filter(x => x.id !== m.id).concat([m]);
    try { await be.save(m, sb(all), user.email, seasonSum(all, m.id, m.status === "final")); }
    catch(err){ toast(/permission/i.test(err.code || err.message || "") ? "This account isn't allowed to change scores." : "Couldn't save. Check the connection."); return; }
    lastEntry = {teamId:m.teamId, teamName:m.teamName, game:m.game, level:m.level, league:m.league, stage:m.stage, startsAt:m.startsAt, bestOf:m.bestOf};
    if (m.season !== season){ toast(`Saved to the ${seasonLabel(m.season)} season. Showing that season now.`); synced.delete(m.season); setSeason(m.season); matches = [m]; }
    cur = clone(m); openId = m.id; location.hash = "m/" + m.id;
  };
}
function readOpp(F){ const school = F.oppSchool.value.trim(), team = F.oppTeam.value.trim(), lib = schoolInfo(site, school); return {school, team, short:F.abbr.value.trim(), abbr:abbrFor(school || team), logo:draft?.opponent?.logo || lib?.logo || ""}; }
function readWhen(F){ const v = F.when.value; if (!v) return ""; const d = new Date(v); return isNaN(d) ? "" : d.toISOString(); }

/* ---------- backup finished matches to the GitHub repo ---------- */
function ghCfg(){ try { return JSON.parse(localStorage.getItem("eagles-gh")); } catch(e){ return null; } }
/* Finals are copied to GitHub two minutes after the last one is saved, so entering a stack of old results makes one
   site update instead of one per match. The hourly backup catches anything this misses. */
let archiveTimer = 0;
function queueArchive(){ clearTimeout(archiveTimer); archiveTimer = setTimeout(() => archive(false), 120000); }
async function archive(loud){ return archiveSeason(season, matches, loud); }
/* Merge in the backed-up season files too (older seasons may only live there). Edits each file in place. */
async function remapArchives(drop, keep, K){
  const c = ghCfg(); if (!c?.token || isMock()) return;
  const H = {"Accept":"application/vnd.github+json", "Authorization":`Bearer ${c.token}`, "X-GitHub-Api-Version":"2022-11-28"};
  const base = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/data/matches/`, ref = "?ref=" + encodeURIComponent(c.branch || "main");
  let files = []; try { const r = await fetch(base + ref, {headers:H, cache:"no-store"}); files = (await r.json()).filter(f => /^\d{4}-\d{2}\.json$/.test(f.name)).map(f => f.name); } catch(e){ return; }
  for (const name of files){
    try {
      const r = await fetch(base + name + ref, {headers:H, cache:"no-store"}); if (!r.ok) continue;
      const f = await r.json(), text = new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\s/g, "")), ch => ch.charCodeAt(0)));
      if (!text.includes(drop)) continue;
      const doc = JSON.parse(text);
      (doc.matches || []).forEach(m => {
        const pk = (m.players || []).find(p => p.id === keep), pd = (m.players || []).find(p => p.id === drop);
        if (pd){ m.players = m.players.filter(p => p.id !== drop); if (!pk) m.players.push({...pd, id:keep, name:K.private ? "" : (K.name || ""), tag:K.tag || "", private:!!K.private}); }
        (m.games || []).forEach(x => { if (x.p && x.p[drop]){ if (!x.p[keep]) x.p[keep] = x.p[drop]; delete x.p[drop]; } });
      });
      const body = JSON.stringify(doc, null, 2) + "\n";
      await fetch(base + name, {method:"PUT", headers:{...H, "Content-Type":"application/json"}, body:JSON.stringify({message:`Scorekeeper: merge duplicate player in ${name}`, content:b64(body), sha:f.sha, branch:c.branch || "main"})});
    } catch(e){ console.error(e); }
  }
}
async function archiveSeason(season, matches, loud){
  const c = ghCfg(); if (!c?.token || isMock()){ if (loud) toast(isMock() ? "Backups are off in test mode." : "Connect this device in the Site Manager first."); return; }
  const finals = matches.filter(m => m.status === "final").map(m => { const {updatedBy, ...rest} = m; return rest; }).sort((a, b) => a.startsAt < b.startsAt ? -1 : 1);
  const path = `data/matches/${season}.json`, api = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;
  const H = {"Accept":"application/vnd.github+json", "Authorization":`Bearer ${c.token}`, "X-GitHub-Api-Version":"2022-11-28"};
  try {
    let sha; const r = await fetch(api + "?ref=" + encodeURIComponent(c.branch || "main"), {headers:H, cache:"no-store"}); if (r.ok) sha = (await r.json()).sha;
    const body = JSON.stringify({season, updated:new Date().toISOString(), matches:finals}, null, 2) + "\n";
    const put = await fetch(api, {method:"PUT", headers:{...H, "Content-Type":"application/json"}, body:JSON.stringify({message:`Scorekeeper: back up ${seasonLabel(season)} results`, content:b64(body), sha, branch:c.branch || "main"})});
    if (!put.ok) throw new Error(put.status);
    if (loud) toast(`Backed up ${finals.length} finished match${finals.length === 1 ? "" : "es"}.`);
  } catch(e){ if (loud) toast("Backup didn't go through (" + e.message + "). Scores are still saved."); }
}
function b64(s){ const bytes = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); }
