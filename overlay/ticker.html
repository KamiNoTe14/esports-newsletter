<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Score ticker · Hartland Esports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<!-- Stream overlay: an ESPN BottomLine-style score ticker. Add it in OBS as a Browser Source at 1920 x 1080; the page is
     transparent except for the bar. One score at a time flips into view, and the label on the left changes with each section
     (Eagles Esports, Hartland Athletics, NFL, ...). Live scores update the moment the scorekeeper changes them.
     Options: ?hold=6 (seconds per score), ?height=72, ?top=1 (bar at the top), ?bg=1 (grey page background, for testing),
     ?sections=esports,athletics,pro,college,news (leave any out to hide it; ?sections=esports shows only our matches). -->
<style>
:root{--navy:#00274C;--gold:#FFBC05;--white:#fff;--live:#E8202A;--h:72px;--f:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body.bg{background:#555}
.bar{position:fixed;left:0;right:0;bottom:0;height:var(--h);display:flex;align-items:stretch;font-family:var(--f);color:var(--white);
  background:linear-gradient(180deg,#0B3A6B 0%,var(--navy) 48%,#001A33 100%);border-top:3px solid var(--gold);box-shadow:0 -6px 20px rgba(0,0,0,.4)}
body.top .bar{top:0;bottom:auto;border-top:0;border-bottom:3px solid var(--gold)}
.brand{flex:none;display:flex;align-items:center;gap:10px;padding:0 18px 0 14px;background:#001A33;border-right:2px solid rgba(255,188,5,.5)}
.brand img{height:calc(var(--h) * .58)}
.brand b{display:block;font-weight:800;font-size:calc(var(--h) * .36);letter-spacing:.05em;text-transform:uppercase;line-height:.95}
.brand small{display:block;font-size:calc(var(--h) * .2);letter-spacing:.16em;font-weight:700;color:var(--gold);text-transform:uppercase}
/* the section label (changes with each section, like ESPN's "NHL") */
.lab{flex:none;width:calc(var(--h) * 3.2);position:relative;overflow:hidden;border-right:2px solid rgba(255,255,255,.18)}
.lab div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;font-weight:800;font-size:calc(var(--h) * .34);letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--gold)}
.lab div.ann{background:var(--gold);color:var(--navy)}
/* the score area: one card at a time flips up into view */
.main{flex:1;position:relative;overflow:hidden;min-width:0}
.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:1px}
.l1{display:flex;align-items:baseline;gap:14px;white-space:nowrap;font-size:calc(var(--h) * .46);font-weight:700;line-height:1.05}
.l2{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--h) * .26);font-weight:600;color:#C9D6E3;letter-spacing:.02em;line-height:1.1}
.l2 b{color:var(--gold);font-weight:700}
.nm{text-transform:none}
.sc{font-weight:800;font-variant-numeric:tabular-nums;min-width:1ch}
.w{color:var(--gold)}
.lo{color:#AFC0D3}
.sep{width:2px;align-self:stretch;background:rgba(255,255,255,.35);margin:4px 4px}
.st{font-size:calc(var(--h) * .27);font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,.14);align-self:center}
.st.live{background:var(--live);animation:pulse 1.6s infinite}
.st.fin{background:#fff;color:var(--navy)}
.mi{color:var(--gold)}
.head{font-size:calc(var(--h) * .38);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head.long{font-size:calc(var(--h) * .31)}
.card.ann{background:var(--gold);color:var(--navy)}.card.ann .head{font-weight:800;text-transform:uppercase}.card.ann .l2{color:var(--navy)}
/* "Up next" panel on the right, like ESPN's next-game promo */
.next{flex:none;width:calc(var(--h) * 5.4);display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(90deg,rgba(255,188,5,.12),rgba(255,188,5,.04));border-left:2px solid var(--gold);overflow:hidden}
.next .ic{flex:none;font-weight:800;font-size:calc(var(--h) * .22);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);background:var(--gold);padding:3px 7px;border-radius:3px;line-height:1.1;text-align:center}
.next .tx{min-width:0;line-height:1.1}
.next .tx b{display:block;font-size:calc(var(--h) * .24);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .tx span{display:block;font-size:calc(var(--h) * .3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next[hidden]{display:none}
.clock{flex:none;display:flex;align-items:center;padding:0 16px;font-size:calc(var(--h) * .32);font-weight:700;background:#001A33;font-variant-numeric:tabular-nums}
/* takeover for a pinned announcement */
.alert{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 26px;background:var(--gold);color:var(--navy);z-index:5;
  font-size:calc(var(--h) * .44);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert span{background:var(--navy);color:var(--gold);font-size:calc(var(--h) * .26);letter-spacing:.14em;padding:3px 10px;border-radius:3px}
/* flip animation */
.in{animation:up .4s cubic-bezier(.2,.8,.2,1) .18s both}.out{animation:away .25s ease-in both}
@keyframes up{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes away{from{transform:none;opacity:1}to{transform:translateY(-100%);opacity:0}}
@keyframes pulse{50%{opacity:.6}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><img src="../assets/eagle.png" alt=""><div><b>Eagles</b><small>Esports</small></div></div>
  <div class="lab" id="lab"></div>
  <div class="main" id="main"></div>
  <div class="next" id="next" hidden></div>
  <div class="clock" id="clock"></div>
</div>
<script type="module">
import {watchBoard, watchTicker} from "../assets/live.js?v=21";
import {gameFor, oppShort, postseason, rivalFor, fmtTime, roundLabel} from "../assets/matches.js?v=15";
const q = new URLSearchParams(location.search);
const HOLD = (+q.get("hold") || 6) * 1000;
if (q.get("height")) document.documentElement.style.setProperty("--h", (+q.get("height")) + "px");
if (q.get("top")) document.body.classList.add("top");
if (q.get("bg")) document.body.classList.add("bg");
const WANT = new Set((q.get("sections") || "esports,athletics,pro,college,news").split(",").map(x => x.trim()));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "America/Detroit";
const day = d => new Date(d).toLocaleDateString("en-CA", {timeZone:TZ});
const hm = d => new Date(d).toLocaleTimeString("en-US", {timeZone:TZ, hour:"numeric", minute:"2-digit"});
const when = d => day(d) === day(Date.now()) ? hm(d) : new Date(d).toLocaleDateString("en-US", {timeZone:TZ, weekday:"short"}) + " " + hm(d);

let site = {games:[], teams:[]}, board = {matches:[]}, ticker = {messages:[]};
const extra = {athletics:[], news:[], leagues:{}};
try { site = await (await fetch("../data/site.json?v=" + Date.now(), {cache:"no-store"})).json(); } catch(e){}
const clock = () => { document.getElementById("clock").textContent = hm(Date.now()); };
clock(); setInterval(clock, 10000);

/* ---------- data sources ---------- */
const ESPN = [
  {key:"nfl", label:"NFL", path:"football/nfl", kind:"pro"},
  {key:"mlb", label:"MLB", path:"baseball/mlb", kind:"pro"},
  {key:"nba", label:"NBA", path:"basketball/nba", kind:"pro"},
  {key:"nhl", label:"NHL", path:"hockey/nhl", kind:"pro"},
  {key:"cfb", label:"College Football", path:"football/college-football", groups:[5, 15], kind:"college"},
  {key:"cbb", label:"Men's College Hoops", path:"basketball/mens-college-basketball", groups:[7, 14], kind:"college"},
  {key:"wbb", label:"Women's College Hoops", path:"basketball/womens-college-basketball", groups:[7, 14], kind:"college"}
];
const MICHIGAN = /^(DET|MICH|MSU|WMU|EMU|CMU)$/;
async function loadJSON(u){ const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw 0; return r.json(); }
async function loadLocal(){
  if (WANT.has("athletics")) try { extra.athletics = (await loadJSON("../data/ticker/athletics.json")).items || []; } catch(e){}
  if (WANT.has("news")) try { extra.news = (await loadJSON("../data/ticker/news.json")).items || []; } catch(e){}
}
async function loadESPN(){
  for (const L of ESPN){
    if (!WANT.has(L.kind)) continue;
    try {
      const lists = await Promise.all((L.groups || [null]).map(g => loadJSON(`https://site.api.espn.com/apis/site/v2/sports/${L.path}/scoreboard${g ? `?groups=${g}` : ""}`)));
      const seen = new Set(), now = Date.now();
      extra.leagues[L.key] = lists.flatMap(d => d.events || []).filter(e => !seen.has(e.id) && seen.add(e.id))
        .filter(e => e.status?.type?.state === "in" || Math.abs(new Date(e.date) - now) < 30 * 36e5)
        .sort((a, b) => (b.status?.type?.state === "in") - (a.status?.type?.state === "in") || (a.date < b.date ? -1 : 1));
    } catch(e){}
  }
}
const active = () => (ticker.messages || []).filter(x => x.text && (!x.until || new Date(x.until) > new Date()));

/* ---------- cards: one score (or headline) each ---------- */
const st = (kind, text) => `<span class="st ${kind}">${esc(text)}</span>`;
function side(name, score, cls){ return `<span class="nm ${cls}">${esc(name)}</span>${score === null ? "" : `<span class="sc ${cls}">${esc(score)}</span>`}`; }
function ourCard(m){
  const g = gameFor(site, m.game), live = m.status === "live", fin = m.status === "final";
  const us = live || fin ? (m.score?.us ?? 0) : null, them = live || fin ? (m.score?.them ?? 0) : null, W = fin && m.result === "W", L = fin && m.result === "L";
  const team = String(m.teamName || "Eagles").trim();
  const cg = live ? m.current : null;
  const status = live ? st("live", `Live${cg?.n ? ` · ${(g.unit || "Game")[0]}${cg.n}` : ""}`) : fin ? st("fin", m.forfeit ? "Final · FF" : "Final") : st("", when(m.startsAt));
  const ps = postseason(m), rv = rivalFor(site, m);
  const bits = [g.name, m.league, ps ? `🏆 ${ps.label}` : roundLabel(m, false) || "", rv ? `⚔ ${rv.title || "Rivalry"}` : "", live && cg && g.points && (cg.us || cg.them) ? `${g.unit || "Game"} ${cg.n}: ${cg.us}–${cg.them}` : "", !live && !fin ? `Best of ${m.bestOf}` : ""].filter(Boolean);
  return {sec:"Eagles Esports", key:"e" + m.id, live,
    l1:`${side("Hartland " + team.replace(new RegExp("^" + (g.short || g.name || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*", "i"), ""), us, W ? "w" : L ? "lo" : "mi")}<span class="sep"></span>${side(oppShort(m), them, L ? "w" : W ? "lo" : "")}${status}`,
    l2:bits.map(esc).join(" · ")};
}
function espnCard(L, e){
  const c = e.competitions?.[0] || {}, s = e.status?.type || {}, t = [...(c.competitors || [])].sort((a) => a.homeAway === "away" ? -1 : 1);
  const live = s.state === "in", done = s.state === "post", best = done ? Math.max(...t.map(x => +x.score || 0)) : null;
  const one = x => { const ab = x.team?.abbreviation || "", w = done && +x.score === best && t.some(y => +y.score !== best);
    return side(x.team?.shortDisplayName || x.team?.displayName || ab, s.state === "pre" ? null : (x.score ?? ""), w ? "w" : done ? "lo" : MICHIGAN.test(ab) ? "mi" : ""); };
  const status = live ? st("live", s.shortDetail || "Live") : done ? st("fin", /final/i.test(s.shortDetail || "") ? s.shortDetail : "Final") : st("", hm(e.date));
  const note = c.headlines?.[0]?.shortLinkText || c.notes?.[0]?.headline || (c.broadcasts?.[0]?.names || []).join(", ") || c.venue?.fullName || "";
  return {sec:L.label, key:L.key + e.id, live, l1:`${one(t[0])}<span class="sep"></span>${one(t[1])}${status}`, l2:esc(note)};
}
function athCard(a){
  const t = [a.home, a.away], fin = a.final, best = fin ? Math.max(t[0].score, t[1].score) : null, tie = fin && t[0].score === t[1].score;
  const one = x => side(x.name, fin ? x.score : null, fin && !tie ? (x.score === best ? "w" : "lo") : /hartland/i.test(x.name) ? "mi" : "");
  return {sec:"Hartland Athletics", key:"a" + a.link + a.at,
    l1:`${one(t[0])}<span class="sep"></span>${one(t[1])}${fin ? st("fin", "Final") : st("", when(a.at))}`,
    l2:`<b>${esc(a.sport)}</b> · ${esc(new Date(a.at).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}))}`};
}
function annCard(x){ return {sec:"Update", ann:true, key:"n" + x.id, l1:`<span class="head">📣 ${esc(x.text)}</span>`, l2:"Hartland Eagles Esports"}; }

function pickOurs(){
  const all = board.matches || [], now = Date.now(), today = day(now);
  const live = all.filter(m => m.status === "live");
  const fins = all.filter(m => m.status === "final").sort((a, b) => a.startsAt > b.startsAt ? -1 : 1);
  const todayFin = fins.filter(m => day(m.startsAt) === today);
  const recent = todayFin.length ? todayFin : fins.filter(m => now - new Date(m.startsAt) < 7 * 864e5).slice(0, 6);
  const up = all.filter(m => m.status === "upcoming" && new Date(m.startsAt) - now < 2 * 864e5 && new Date(m.startsAt) - now > -6 * 36e5).sort((a, b) => a.startsAt < b.startsAt ? -1 : 1);
  return {live, list:[...live, ...recent, ...up], next:up[0] || null};
}
function athPick(){
  const now = Date.now(), list = extra.athletics.map(a => ({...a, t:new Date(a.at).getTime()}));
  return [...list.filter(a => !a.final && a.t - now < 864e5 && a.t - now > -5 * 36e5).sort((a, b) => a.t - b.t),
          ...list.filter(a => a.final && now - a.t < 3 * 864e5).sort((a, b) => b.t - a.t).slice(0, 10)];
}

/* The running order: announcements, our esports, then each other section in turn. While we're live, our live
   match comes back between sections so it's never off screen for long. */
function playlist(){
  const ours = WANT.has("esports") ? pickOurs() : {live:[], list:[], next:null};
  const anns = active().filter(x => !x.pinned).map(annCard);
  const oursCards = ours.list.map(ourCard), liveCards = ours.live.map(ourCard);
  const others = [];
  const ath = athPick(); if (ath.length) others.push(ath.map(athCard));
  for (const L of ESPN){ const ev = extra.leagues[L.key] || []; if (ev.length) others.push(ev.map(e => espnCard(L, e))); }
  if (extra.news.length) others.push(extra.news.map(n => ({sec:"Esports News", key:"x" + n.link, l1:`<span class="head${n.title.length > 64 ? " long" : ""}">${esc(n.title)}</span>`, l2:esc(n.source || ""), hold:1.5})));
  const out = [...anns, ...oursCards];
  others.forEach(o => { out.push(...o); if (liveCards.length) out.push(...liveCards, ...anns); });
  if (!out.length) out.push({sec:"Eagles Esports", key:"idle", l1:`<span class="head">Hartland Eagles Esports</span>`, l2:"hartlandesports.com"});
  return {cards:out, next:ours.next};
}

/* ---------- display ---------- */
const lab = document.getElementById("lab"), main = document.getElementById("main"), nextEl = document.getElementById("next");
let list = [], i = -1, shown = null, labelText = "", timer = 0, pinned = null;
function swap(host, html, cls){
  const old = host.lastElementChild;
  if (old){ old.classList.remove("in"); old.classList.add("out"); setTimeout(() => old.remove(), 300); }
  host.insertAdjacentHTML("beforeend", html); host.lastElementChild.classList.add("in");
}
function render(c){
  if (c.sec !== labelText){ labelText = c.sec; swap(lab, `<div class="${c.ann ? "ann" : ""}">${esc(c.sec)}</div>`); }
  swap(main, `<div class="card${c.ann ? " ann" : ""}"><div class="l1">${c.l1}</div>${c.l2 ? `<div class="l2">${c.l2}</div>` : ""}</div>`);
  shown = c;
}
function upNext(n){
  if (!n){ nextEl.hidden = true; return; }
  const g = gameFor(site, n.game);
  nextEl.hidden = false;
  nextEl.innerHTML = `<span class="ic">Up<br>next</span><span class="tx"><b>${esc(n.teamName)}</b><span>vs ${esc(oppShort(n))} · ${esc(when(n.startsAt))}</span></span>`;
}
function step(){
  clearTimeout(timer);
  if (pinned){ timer = setTimeout(step, 2000); return; }
  const p = playlist(); upNext(p.next);
  /* keep our place in the running order when the list is rebuilt */
  let at = -1;
  if (shown) p.cards.forEach((c, k) => { if (c.key === shown.key && (at < 0 || Math.abs(k - i) < Math.abs(at - i))) at = k; });   // the same card may appear more than once
  list = p.cards; i = (at >= 0 ? at : i) + 1; if (i >= list.length) i = 0;
  if (!(shown && list.length === 1 && list[0].key === shown.key)) render(list[i]); else refreshShown();
  timer = setTimeout(step, HOLD * (list[i].hold || 1));
}
/* A live score that changes while it's on screen updates in place instead of waiting for the next flip. */
function refreshShown(){
  if (!shown || pinned) return;
  const fresh = playlist().cards.find(c => c.key === shown.key);
  if (fresh && (fresh.l1 !== shown.l1 || fresh.l2 !== shown.l2)){ const card = main.lastElementChild; card.innerHTML = `<div class="l1">${fresh.l1}</div>${fresh.l2 ? `<div class="l2">${fresh.l2}</div>` : ""}`; shown = fresh; }
}
function checkPin(){
  const pin = active().find(x => x.pinned);
  if (pin){
    if (!pinned){ pinned = document.createElement("div"); pinned.className = "alert in"; document.querySelector(".bar").appendChild(pinned); }
    pinned.innerHTML = `<span>Update</span>${esc(pin.text)}`;
  } else if (pinned){ pinned.remove(); pinned = null; }
}

watchBoard(b => { board = b || {matches:[]}; refreshShown(); upNext(playlist().next); });
watchTicker(t => { ticker = t || {messages:[]}; checkPin();
  const fresh = active().filter(x => !x.pinned).map(x => "n" + x.id); if (fresh.length && !fresh.includes(shown?.key)){ shown = null; i = -1; step(); } });
loadLocal(); setInterval(loadLocal, 5 * 60000);
loadESPN().then(refreshShown); setInterval(() => loadESPN().then(refreshShown), 60000);
setInterval(checkPin, 30000);
setTimeout(step, 300);
</script>
</body>
</html>
